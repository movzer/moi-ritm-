              <div style="font-size:32px; font-weight:700;">${avg} <span class="muted" style="font-size:18px;">/ 10</span></div>
            </div>
          </div>

          <div class="row-between">
            <div class="pills-row">
              ${[['all', 'Все'], ['planned', 'В планах'], ['watched', 'Просмотрено']].map(([f, lbl]) => `
                <button onclick="ui.movieFilter='${f}'; renderView();" class="pill-tab ${ui.movieFilter === f ? 'active' : ''}">${lbl}</button>
              `).join('')}
            </div>
            <input type="text" class="input" style="max-width: 300px;" value="${esc(ui.movieSearch)}" oninput="ui.movieSearch=this.value; updateMoviesDOM();" placeholder="Найти фильм или жанр..." />
          </div>

          <div id="movies-grid-dom" class="grid-2">
            ${renderMoviesGridHTML(list)}
          </div>
        </div>
      `;
    }

    function getFilteredMovies() {
      let list = [...state.movies];
      if (ui.movieFilter !== 'all') list = list.filter(m => m.status === ui.movieFilter);
      if (ui.movieSearch.trim()) {
        const q = ui.movieSearch.trim().toLowerCase();
        list = list.filter(m => m.title.toLowerCase().includes(q) || (m.genre || '').toLowerCase().includes(q) || (m.review || '').toLowerCase().includes(q));
      }
      return list;
    }

    function updateMoviesDOM() {
      const box = document.getElementById('movies-grid-dom');
      if (box) box.innerHTML = renderMoviesGridHTML(getFilteredMovies());
    }

    function renderMoviesGridHTML(list) {
      if (!list.length) {
        return `<div class="empty-box" style="grid-column: 1 / -1;"><h3 style="font-size:24px;">Список фильмов пуст</h3><p class="muted" style="margin-top:6px;">Добавьте любимую картину или фильм, который хотите посмотреть вечером.</p></div>`;
      }
      return list.map(m => {
        const isWatched = m.status === 'watched';
        const score = Number(m.rating) || 0;
        return `
          <div class="card" style="display:flex; flex-direction:column; justify-content:space-between; background:${isWatched ? 'var(--bg-card)' : 'linear-gradient(160deg, #FFFFFF, rgba(244,243,232,0.85))'};">
            <div>
              <div class="row-between" style="align-items:flex-start; margin-bottom:10px;">
                <div class="row" style="gap:6px; flex-wrap:wrap;">
                  <span class="badge" style="background:${isWatched ? 'var(--p-gossamer-green)' : 'var(--p-delicate-blue)'}; color:${isWatched ? 'var(--p-gossamer-green-ink)' : '#38506E'};">
                    ${isWatched ? 'Просмотрено' : 'В планах'}
                  </span>
                  <span class="badge" style="background:var(--p-hushed-violet); color:#4F3945;">${esc(m.genre || 'Кино')}</span>
                  ${m.year ? `<span class="text-sm muted">${esc(m.year)}</span>` : ''}
                </div>
                <div class="row" style="gap:2px;">
                  <button onclick="openMovieModal('${m.id}')" class="icon-btn sm ghost" title="Редактировать">${iconSvg('<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>', 16)}</button>
                  <button onclick="deleteMovie('${m.id}')" class="icon-btn sm ghost danger" title="Удалить">${iconSvg('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>', 16)}</button>
                </div>
              </div>

              <h3 style="font-size:26px; margin-bottom:8px;">${esc(m.title)}</h3>

              ${isWatched ? `
                <div style="background: rgba(242,233,177,0.34); border: 1px solid rgba(185,155,59,0.22); border-radius: 14px; padding: 10px 12px; margin-bottom: 12px;">
                  <div class="row-between" style="margin-bottom:6px;">
                    <span style="font-size:19px; font-weight:700;">${score > 0 ? `${score} / 10` : 'Оцените фильм'}</span>
                    <span class="text-sm italic" style="color: var(--p-pastel-yellow-ink);">${getRatingCaption(score)}</span>
                  </div>
                  ${renderStarRatingHTML(score, (val) => `setMovieRating('${m.id}', ${val})`)}
                </div>
              ` : ''}

              ${m.review ? `<p class="muted" style="font-size:18px; line-height:1.5; margin-bottom:12px;">${esc(m.review)}</p>` : ''}
            </div>

            <div style="padding-top:10px; border-top:1px solid var(--border);">
              ${isWatched ? `
                <div class="text-sm muted">Дата просмотра: <strong>${m.watchDate ? formatHumanDate(m.watchDate) : 'не указана'}</strong></div>
              ` : `
                <button onclick="openMovieModal('${m.id}', true)" class="btn btn-pastel-orchid btn-sm" style="width:100%;">
                  ${iconSvg('<polyline points="20 6 9 17 4 12"/>', 16)}
                  <span>Отметить просмотренным и оценить</span>
                </button>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    function setMovieRating(id, val) {
      const m = state.movies.find(x => x.id === id);
      if (!m) return;
      m.rating = val;
      m.status = 'watched';
      if (!m.watchDate) m.watchDate = toDateStr();
      saveState();
      renderView();
      showToast(`Оценка: ${val}/10 — ${getRatingCaption(val)}`, 'var(--p-pastel-yellow)');
    }

    async function deleteMovie(id) {
      if (!(await askConfirm('Удалить фильм?', 'Фильм и ваш отзыв будут удалены.'))) return;
      state.movies = state.movies.filter(m => m.id !== id);
      saveState(); renderView(); showToast('Фильм удалён');
    }

    function openMovieModal(movieId = null, forceWatched = false) {
      const ex = movieId ? state.movies.find(m => m.id === movieId) : null;
      const status = forceWatched ? 'watched' : (ex?.status || 'planned');
      const rating = ex?.rating || (forceWatched ? 9 : 0);
      const watchDate = ex?.watchDate || (status === 'watched' ? toDateStr() : '');

      openModal(`
        <div class="row-between" style="margin-bottom:18px;">
          <h3 style="font-size:28px;">${forceWatched ? 'Оценить просмотренный фильм' : ex ? 'Редактировать фильм' : 'Новый фильм'}</h3>
          <button onclick="closeModal()" class="icon-btn sm ghost">${iconSvg('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>', 19)}</button>
        </div>
        <form onsubmit="saveMovieForm(event, '${ex ? ex.id : ''}')" class="stack-sm">
          <div>
            <label class="field-label">Название фильма</label>
            <input type="text" name="title" class="input" required value="${esc(ex?.title || '')}" placeholder="Например: Маленькие женщины" autofocus />
          </div>
          <div class="grid-2">
            <div>
              <label class="field-label">Жанр</label>
              <select name="genre" class="input">
                ${MOVIE_GENRES.map(g => `<option value="${g}" ${(ex?.genre || 'Романтика') === g ? 'selected' : ''}>${g}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="field-label">Год</label>
              <input type="text" name="year" class="input" value="${esc(ex?.year || '')}" placeholder="2024" />
            </div>
          </div>
          <div class="grid-2">
            <div>
              <label class="field-label">Статус</label>
              <select name="status" class="input">
                <option value="planned" ${status === 'planned' ? 'selected' : ''}>В планах</option>
                <option value="watched" ${status === 'watched' ? 'selected' : ''}>Просмотрено</option>
              </select>
            </div>
            <div>
              <label class="field-label">Дата просмотра</label>
              <input type="date" name="watchDate" class="input" value="${esc(watchDate)}" />
            </div>
          </div>
          <div>
            <label class="field-label">Ваша оценка: <strong id="modal-movie-score-label">${rating > 0 ? `${rating}/10 · ${getRatingCaption(rating)}` : 'Без оценки'}</strong></label>
            <input type="hidden" name="rating" id="modal-movie-rating" value="${rating}" />
            <div id="modal-movie-stars" style="padding: 8px 12px; border-radius: 13px; background: rgba(242,233,177,0.32); border: 1px solid var(--border);">
              ${renderStarRatingHTML(rating, (v) => `setModalRating('movie', ${v})`)}
            </div>
          </div>
          <div>
            <label class="field-label">Впечатления и отзыв</label>
            <textarea name="review" class="input" rows="4" placeholder="Что больше всего запомнилось? Атмосфера, герои, музыка...">${esc(ex?.review || '')}</textarea>
          </div>
          <div class="row" style="justify-content:flex-end; margin-top:8px;">
            <button type="button" onclick="closeModal()" class="btn btn-secondary btn-sm">Отмена</button>
            <button type="submit" class="btn btn-primary btn-sm">Сохранить</button>
          </div>
        </form>
      `);
    }

    function setModalRating(kind, val) {
      const inp = document.getElementById(`modal-${kind}-rating`);
      const lbl = document.getElementById(`modal-${kind}-score-label`);
      const wrap = document.getElementById(`modal-${kind}-stars`);
      if (inp) inp.value = val;
      if (lbl) lbl.textContent = `${val}/10 · ${getRatingCaption(val)}`;
      if (wrap) wrap.innerHTML = renderStarRatingHTML(val, (v) => `setModalRating('${kind}', ${v})`);
    }

    function saveMovieForm(e, existingId) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const status = fd.get('status');
      const payload = {
        title: fd.get('title').trim(),
        genre: fd.get('genre'),
        year: fd.get('year').trim(),
        status,
        rating: Number(fd.get('rating')) || 0,
        watchDate: fd.get('watchDate') || (status === 'watched' ? toDateStr() : ''),
        review: fd.get('review').trim()
      };
      if (!payload.title) return;
      if (existingId) {
        const idx = state.movies.findIndex(m => m.id === existingId);
        if (idx !== -1) state.movies[idx] = { ...state.movies[idx], ...payload };
        showToast('Фильм обновлён', 'var(--p-hushed-violet)');
      } else {
        state.movies.unshift({ id: uid('m'), ...payload });
        showToast('Фильм добавлен', 'var(--p-hushed-violet)');
      }
      saveState(); closeModal(); renderView();
    }

    /* ==========================================================================
       12. РАЗДЕЛ 6: КНИГИ / ЧИТАТЕЛЬСКИЙ ДНЕВНИК + ЦИТАТЫ
       ========================================================================== */
    function renderBooksView() {
      const all = state.books;
      const totalQuotes = all.reduce((s, b) => s + (b.quotes?.length || 0), 0);

      const tabs = [
        ['all', `Все (${all.length})`],
        ['reading', 'Читаю сейчас'],
        ['read', 'Прочитано'],
        ['want', 'Хочу прочитать'],
        ['quotes', `Все цитаты (${totalQuotes})`]
      ];

      return `
        <div class="view-enter stack">
          <div class="page-header">
            <div>
              <div class="eyebrow">Читательский дневник</div>
              <h1 class="page-title">Книги и цитаты</h1>
            </div>
            <button onclick="openBookModal()" class="btn btn-primary btn-sm">
              ${iconSvg('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', 16)}
              <span>Добавить книгу</span>
            </button>
          </div>

          <div class="row-between">
            <div class="pills-row">
              ${tabs.map(([id, lbl]) => `
                <button onclick="ui.bookTab='${id}'; renderView();" class="pill-tab ${ui.bookTab === id ? 'active' : ''}">${lbl}</button>
              `).join('')}
            </div>
            <input type="text" class="input" style="max-width: 300px;" value="${esc(ui.bookSearch)}" oninput="ui.bookSearch=this.value; updateBooksDOM();" placeholder="${ui.bookTab === 'quotes' ? 'Поиск по цитатам...' : 'Книга, автор или жанр...'}" />
          </div>

          <div id="books-content-dom">
            ${ui.bookTab === 'quotes' ? renderAllQuotesFeedHTML() : renderBooksListHTML()}
          </div>
        </div>
      `;
    }

    function updateBooksDOM() {
      const box = document.getElementById('books-content-dom');
      if (!box) return;
      box.innerHTML = ui.bookTab === 'quotes' ? renderAllQuotesFeedHTML() : renderBooksListHTML();
    }

    function renderBooksListHTML() {
      let list = [...state.books];
      if (ui.bookTab !== 'all' && ui.bookTab !== 'quotes') list = list.filter(b => b.status === ui.bookTab);
      if (ui.bookSearch.trim()) {
        const q = ui.bookSearch.trim().toLowerCase();
        list = list.filter(b =>
          b.title.toLowerCase().includes(q) ||
          (b.author || '').toLowerCase().includes(q) ||
          (b.genre || '').toLowerCase().includes(q) ||
          (b.quotes || []).some(qt => qt.text.toLowerCase().includes(q))
        );
      }

      if (!list.length) {
        return `<div class="empty-box"><h3 style="font-size:24px;">Полка пока пуста</h3><p class="muted" style="margin-top:6px;">Добавьте книгу, которую читаете сейчас или мечтаете открыть.</p></div>`;
      }

      const statusMeta = {
        reading: { label: 'Читаю сейчас', bg: 'var(--p-orchid-petal)', ink: '#FFFFFF' },
        read: { label: 'Прочитано', bg: 'var(--p-gossamer-green)', ink: 'var(--p-gossamer-green-ink)' },
        want: { label: 'Хочу прочитать', bg: 'var(--p-delicate-blue)', ink: '#38506E' }
      };

      return `
        <div class="stack">
          ${list.map(b => {
            const sm = statusMeta[b.status] || statusMeta.want;
            const score = Number(b.rating) || 0;
            const quotes = b.quotes || [];
            return `
              <div class="card" style="padding: 24px;">
                <div class="row-between" style="align-items:flex-start; margin-bottom:10px;">
                  <div class="row" style="gap:8px; flex-wrap:wrap;">
                    <span class="badge" style="background:${sm.bg}; color:${sm.ink};">${sm.label}</span>
                    ${b.genre ? `<span class="badge" style="background:var(--p-cappucino-foam); color:var(--ink-muted);">${esc(b.genre)}</span>` : ''}
                  </div>
                  <div class="row" style="gap:4px;">
                    <button onclick="openBookModal('${b.id}')" class="icon-btn sm ghost" title="Редактировать">${iconSvg('<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>', 16)}</button>
                    <button onclick="deleteBook('${b.id}')" class="icon-btn sm ghost danger" title="Удалить">${iconSvg('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>', 16)}</button>
                  </div>
                </div>

                <h3 style="font-size:29px; line-height:1.15;">${esc(b.title)}</h3>
                <div class="muted italic" style="font-size:19px; margin-bottom:14px;">${esc(b.author || 'Автор не указан')}</div>

                <div style="background: rgba(242,233,177,0.34); border: 1px solid rgba(185,155,59,0.2); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px;">
                  <div class="row-between" style="margin-bottom:4px;">
                    <span style="font-size:18px; font-weight:700;">Оценка: ${score > 0 ? `${score} / 10` : 'пока без оценки'}</span>
                    <span class="text-sm italic" style="color:var(--p-pastel-yellow-ink);">${getRatingCaption(score)}</span>
                  </div>
                  ${renderStarRatingHTML(score, (val) => `setBookRating('${b.id}', ${val})`)}
                </div>

                ${b.review ? `<p class="muted" style="font-size:18px; line-height:1.55; margin-bottom:18px;">${esc(b.review)}</p>` : ''}

                <div style="padding-top:16px; border-top:1px solid var(--border);">
                  <div class="row-between" style="margin-bottom:12px;">
                    <div class="row" style="gap:8px;">
                      <span class="dot" style="background: var(--p-orchid-petal);"></span>
                      <h4 style="font-size:21px;">Любимые цитаты (${quotes.length})</h4>
                    </div>
                  </div>

                  ${quotes.length ? `
                    <div class="stack-sm" style="margin-bottom:14px;">
                      ${quotes.map(qt => `
                        <div class="quote-card">
                          <div class="quote-text"><span class="quote-mark">«</span>${esc(qt.text)}<span class="quote-mark" style="margin-left:3px;">»</span></div>
                          <div class="row-between" style="margin-top:8px;">
                            <span class="text-sm muted">${qt.page ? esc(qt.page) : 'Избранная строка'}</span>
                            <div class="row" style="gap:4px;">
                              <button onclick="copyBookQuote('${b.id}', '${qt.id}')" class="icon-btn sm ghost" title="Скопировать цитату">${iconSvg('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>', 15)}</button>
                              <button onclick="deleteBookQuote('${b.id}', '${qt.id}')" class="icon-btn sm ghost danger" title="Удалить цитату">${iconSvg('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>', 15)}</button>
                            </div>
                          </div>
                        </div>
                      `).join('')}
                    </div>
                  ` : `<p class="text-sm muted italic" style="margin-bottom:12px;">Сохраняйте здесь строки, которые отозвались в сердце.</p>`}

                  <form onsubmit="addQuoteToBook(event, '${b.id}')" style="background: rgba(197,183,209,0.18); border: 1px solid rgba(197,183,209,0.45); border-radius: 14px; padding: 12px;">
                    <textarea name="text" class="input" rows="2" required placeholder="Вписать любимую цитату из этой книги..." style="min-height:64px; margin-bottom:8px;"></textarea>
                    <div class="row" style="flex-wrap:wrap;">
                      <input type="text" name="page" class="input" style="flex:1; min-width:160px; padding:7px 12px;" placeholder="Страница или глава (необязательно)" />
                      <button type="submit" class="btn btn-pastel-orchid btn-sm">Сохранить цитату</button>
                    </div>
                  </form>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderAllQuotesFeedHTML() {
      const q = ui.bookSearch.trim().toLowerCase();
      const items = [];
      state.books.forEach(b => {
        (b.quotes || []).forEach(qt => {
          if (!q || qt.text.toLowerCase().includes(q) || b.title.toLowerCase().includes(q) || (b.author || '').toLowerCase().includes(q)) {
            items.push({ bookId: b.id, bookTitle: b.title, bookAuthor: b.author, quote: qt });
          }
        });
      });

      if (!items.length) {
        return `<div class="empty-box"><h3 style="font-size:24px;">Цитат пока нет</h3><p class="muted" style="margin-top:6px;">Добавляйте любимые фразы внутри карточек книг — они все соберутся здесь.</p></div>`;
      }

      return `
        <div class="notes-masonry">
          ${items.map((item, idx) => {
            const bg = idx % 2 === 0 ? 'var(--p-cappucino-foam)' : 'rgba(197,183,209,0.24)';
            return `
              <div class="note-card" style="background:${bg}; border-left: 4px solid var(--p-orchid-petal);">
                <div class="quote-text" style="font-size:21px; margin-bottom:14px;">
                  <span class="quote-mark">«</span>${esc(item.quote.text)}<span class="quote-mark" style="margin-left:3px;">»</span>
                </div>
                <div class="row-between" style="padding-top:10px; border-top:1px solid var(--border);">
                  <div>
                    <div style="font-size:17px; font-weight:700;">${esc(item.bookTitle)}</div>
                    <div class="text-sm muted italic">${esc(item.bookAuthor || '')}${item.quote.page ? ` · ${esc(item.quote.page)}` : ''}</div>
                  </div>
                  <button onclick="copyBookQuote('${item.bookId}', '${item.quote.id}')" class="icon-btn sm ghost" title="Скопировать">${iconSvg('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>', 16)}</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function setBookRating(id, val) {
      const b = state.books.find(x => x.id === id);
      if (!b) return;
      b.rating = val;
      saveState();
      renderView();
      showToast(`Книга оценена на ${val}/10`, 'var(--p-pastel-yellow)');
    }

    function addQuoteToBook(e, bookId) {
      e.preventDefault();
      const b = state.books.find(x => x.id === bookId);
      if (!b) return;
      const fd = new FormData(e.target);
      const text = fd.get('text').trim();
      if (!text) return;
      b.quotes = b.quotes || [];
      b.quotes.unshift({ id: uid('q'), text, page: fd.get('page').trim() });
      saveState();
      renderView();
      showToast('Цитата сохранена в дневник', 'var(--p-orchid-petal)');
    }

    function copyBookQuote(bookId, quoteId) {
      const b = state.books.find(x => x.id === bookId);
      const qt = b?.quotes?.find(q => q.id === quoteId);
      if (!qt) return;
      copyTextSafe(`«${qt.text}» — ${b.title}${b.author ? ` (${b.author})` : ''}`);
    }

    async function deleteBookQuote(bookId, quoteId) {
      if (!(await askConfirm('Удалить цитату?', 'Строка будет удалена из читательского дневника.'))) return;
      const b = state.books.find(x => x.id === bookId);
      if (!b) return;
      b.quotes = (b.quotes || []).filter(q => q.id !== quoteId);
      saveState(); renderView(); showToast('Цитата удалена');
    }

    async function deleteBook(id) {
      if (!(await askConfirm('Удалить книгу?', 'Книга и все сохранённые в ней цитаты будут удалены.'))) return;
      state.books = state.books.filter(b => b.id !== id);
      saveState(); renderView(); showToast('Книга удалена');
    }

    function openBookModal(bookId = null) {
      const ex = bookId ? state.books.find(b => b.id === bookId) : null;
      const rating = ex?.rating || 0;
      openModal(`
        <div class="row-between" style="margin-bottom:18px;">
          <h3 style="font-size:28px;">${ex ? 'Редактировать книгу' : 'Новая книга'}</h3>
          <button onclick="closeModal()" class="icon-btn sm ghost">${iconSvg('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>', 19)}</button>
        </div>
        <form onsubmit="saveBookForm(event, '${ex ? ex.id : ''}')" class="stack-sm">
          <div>
            <label class="field-label">Название книги</label>
            <input type="text" name="title" class="input" required value="${esc(ex?.title || '')}" placeholder="Например: Цирцея" autofocus />
          </div>
          <div class="grid-2">
            <div>
              <label class="field-label">Автор</label>
              <input type="text" name="author" class="input" value="${esc(ex?.author || '')}" placeholder="Имя автора" />
            </div>
            <div>
              <label class="field-label">Жанр</label>
              <select name="genre" class="input">
                ${BOOK_GENRES.map(g => `<option value="${g}" ${(ex?.genre || 'Мифология') === g ? 'selected' : ''}>${g}</option>`).join('')}
              </select>
            </div>
          </div>
          <div>
            <label class="field-label">Статус чтения</label>
            <select name="status" class="input">
              <option value="reading" ${(ex?.status || 'reading') === 'reading' ? 'selected' : ''}>Читаю сейчас</option>
              <option value="read" ${ex?.status === 'read' ? 'selected' : ''}>Прочитано</option>
              <option value="want" ${ex?.status === 'want' ? 'selected' : ''}>Хочу прочитать</option>
            </select>
          </div>
          <div>
            <label class="field-label">Оценка: <strong id="modal-book-score-label">${rating > 0 ? `${rating}/10 · ${getRatingCaption(rating)}` : 'Без оценки'}</strong></label>
            <input type="hidden" name="rating" id="modal-book-rating" value="${rating}" />
            <div id="modal-book-stars" style="padding: 8px 12px; border-radius: 13px; background: rgba(242,233,177,0.32); border: 1px solid var(--border);">
              ${renderStarRatingHTML(rating, (v) => `setModalRating('book', ${v})`)}
            </div>
          </div>
          <div>
            <label class="field-label">Личные впечатления</label>
            <textarea name="review" class="input" rows="4" placeholder="Ваши мысли о книге, слоге и героях...">${esc(ex?.review || '')}</textarea>
          </div>
          <div class="row" style="justify-content:flex-end; margin-top:8px;">
            <button type="button" onclick="closeModal()" class="btn btn-secondary btn-sm">Отмена</button>
            <button type="submit" class="btn btn-primary btn-sm">Сохранить</button>
          </div>
        </form>
      `);
    }

    function saveBookForm(e, existingId) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const payload = {
        title: fd.get('title').trim(),
        author: fd.get('author').trim(),
        genre: fd.get('genre'),
        status: fd.get('status'),
        rating: Number(fd.get('rating')) || 0,
        review: fd.get('review').trim()
      };
      if (!payload.title) return;
      if (existingId) {
        const idx = state.books.findIndex(b => b.id === existingId);
        if (idx !== -1) state.books[idx] = { ...state.books[idx], ...payload };
        showToast('Книга обновлена', 'var(--p-orchid-petal)');
      } else {
        state.books.unshift({ id: uid('b'), ...payload, quotes: [] });
        showToast('Книга добавлена в дневник', 'var(--p-orchid-petal)');
      }
      saveState(); closeModal(); renderView();
    }

    /* ==========================================================================
       13. РАЗДЕЛ 7: ЗАМЕТКИ (ВСЕ 9 ОТТЕНКОВ PANTONE)
       ========================================================================== */
    function renderNotesView() {
      const filtered = getFilteredNotes();
      return `
        <div class="view-enter stack">
          <div class="page-header">
            <div>
              <div class="eyebrow">Мысли и вдохновение</div>
              <h1 class="page-title">Заметки</h1>
            </div>
            <button onclick="openNoteModal()" class="btn btn-primary btn-sm">
              ${iconSvg('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', 16)}
              <span>Новая заметка</span>
            </button>
          </div>

          <div class="row-between">
            <div class="pills-row">
              ${NOTE_CATEGORIES.map(c => `
                <button onclick="ui.noteCategory='${c}'; renderView();" class="pill-tab ${ui.noteCategory === c ? 'active' : ''}">${c}</button>
              `).join('')}
            </div>
            <input type="text" class="input" style="max-width: 300px;" value="${esc(ui.noteSearch)}" oninput="ui.noteSearch=this.value; updateNotesDOM();" placeholder="Найти заметку..." />
          </div>

          <div id="notes-dom">
            ${renderNotesContentHTML(filtered)}
          </div>
        </div>
      `;
    }

    function getFilteredNotes() {
      let list = [...state.notes];
      if (ui.noteCategory !== 'Все') list = list.filter(n => n.category === ui.noteCategory);
      if (ui.noteSearch.trim()) {
        const q = ui.noteSearch.trim().toLowerCase();
        list = list.filter(n => n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q));
      }
      return list;
    }

    function updateNotesDOM() {
      const box = document.getElementById('notes-dom');
      if (box) box.innerHTML = renderNotesContentHTML(getFilteredNotes());
    }

    function renderNotesContentHTML(list) {
      if (!list.length) {
        return `<div class="empty-box"><h3 style="font-size:24px;">Заметок пока нет</h3><p class="muted" style="margin-top:6px;">Создайте карточку в любом из 9 пастельных оттенков Pantone.</p></div>`;
      }
      const pinned = list.filter(n => n.pinned);
      const others = list.filter(n => !n.pinned);
      return `
        <div class="stack">
          ${pinned.length ? `<div><div class="eyebrow" style="margin-bottom:10px;">Закреплённые</div><div class="notes-masonry">${pinned.map(renderNoteCard).join('')}</div></div>` : ''}
          ${others.length ? `<div>${pinned.length ? '<div class="eyebrow" style="margin-bottom:10px;">Остальные</div>' : ''}<div class="notes-masonry">${others.map(renderNoteCard).join('')}</div></div>` : ''}
        </div>
      `;
    }

    function renderNoteCard(n) {
      const col = PANTONE_COLORS.find(c => c.id === n.color) || PANTONE_COLORS[7];
      const darkSurf = !col.darkText;
      return `
        <div class="note-card ${darkSurf ? 'dark-surface' : ''}" style="background:${col.hex};">
          <div class="row-between" style="align-items:flex-start; margin-bottom:10px;">
            <h4 onclick="openNoteModal('${n.id}')" style="font-size:23px; cursor:pointer;">${esc(n.title || 'Без названия')}</h4>
            <button onclick="togglePinNote('${n.id}')" class="icon-btn sm ghost" style="${darkSurf ? 'color:#FFFFFF;' : ''}" title="${n.pinned ? 'Открепить' : 'Закрепить'}">
              ${iconSvg('<path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>', 16)}
            </button>
          </div>
          <div onclick="openNoteModal('${n.id}')" class="note-body" style="white-space:pre-line; font-size:18px; line-height:1.5; cursor:pointer; margin-bottom:14px; opacity:0.92;">${esc(n.content)}</div>
          <div class="note-meta row-between" style="padding-top:10px; border-top:1px solid rgba(38,48,64,0.12); font-size:14px;">
            <div class="row" style="gap:6px;">
              <span class="badge" style="background:rgba(255,255,255,0.62); color:var(--ink-main);">${esc(n.category)}</span>
              <span>${col.name}</span>
            </div>
            <div class="row" style="gap:2px;">
              <button onclick="openNoteModal('${n.id}')" class="icon-btn sm ghost" style="${darkSurf ? 'color:#FFFFFF;' : ''}">${iconSvg('<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>', 15)}</button>
              <button onclick="deleteNote('${n.id}')" class="icon-btn sm ghost danger" style="${darkSurf ? 'color:#FFFFFF;' : ''}">${iconSvg('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>', 15)}</button>
            </div>
          </div>
        </div>
      `;
    }

    function togglePinNote(id) { const n = state.notes.find(x => x.id === id); if (n) { n.pinned = !n.pinned; saveState(); renderView(); } }
    async function deleteNote(id) {
      if (!(await askConfirm('Удалить заметку?', 'Запись будет удалена без возможности восстановления.'))) return;
      state.notes = state.notes.filter(n => n.id !== id);
      saveState(); renderView(); showToast('Заметка удалена');
    }

    function openNoteModal(noteId = null) {
      const ex = noteId ? state.notes.find(n => n.id === noteId) : null;
      const curColor = ex?.color || 'delicate-blue';
      openModal(`
        <div class="row-between" style="margin-bottom:18px;">
          <h3 style="font-size:28px;">${ex ? 'Редактировать заметку' : 'Новая заметка'}</h3>
          <button onclick="closeModal()" class="icon-btn sm ghost">${iconSvg('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>', 19)}</button>
        </div>
        <form onsubmit="saveNoteForm(event, '${ex ? ex.id : ''}')" class="stack-sm">
          <div>
            <label class="field-label">Заголовок</label>
            <input type="text" name="title" class="input" required value="${esc(ex?.title || '')}" placeholder="О чём эта заметка?" autofocus />
          </div>
          <div>
            <label class="field-label">Текст заметки</label>
            <textarea name="content" class="input" rows="5" placeholder="Пишите свободно — шрифт уже настроен для красоты...">${esc(ex?.content || '')}</textarea>
          </div>
          <div>
            <label class="field-label">Категория</label>
            <select name="category" class="input">
              ${NOTE_CATEGORIES.filter(c => c !== 'Все').map(c => `<option value="${c}" ${(ex?.category || 'Личное') === c ? 'selected' : ''}>${c}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="field-label">Оттенок Pantone (9 пастельных цветов)</label>
            <div class="pantone-grid">
              ${PANTONE_COLORS.map(c => `
                <label class="pantone-option">
                  <input type="radio" name="color" value="${c.id}" ${curColor === c.id ? 'checked' : ''} />
                  <div class="pantone-tile">
                    <span class="pantone-swatch" style="background:${c.hex};"></span>
                    <span class="pantone-name">${c.name}</span>
                  </div>
                </label>
              `).join('')}
            </div>
          </div>
          <label class="row" style="gap:8px; cursor:pointer; font-size:17px; margin-top:4px;">
            <input type="checkbox" name="pinned" ${ex?.pinned ? 'checked' : ''} style="width:18px;height:18px;" />
            <span>Закрепить заметку наверху</span>
          </label>
          <div class="row" style="justify-content:flex-end; margin-top:8px;">
            <button type="button" onclick="closeModal()" class="btn btn-secondary btn-sm">Отмена</button>
            <button type="submit" class="btn btn-primary btn-sm">Сохранить</button>
          </div>
        </form>
      `);
    }

    function saveNoteForm(e, existingId) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = {
        title: fd.get('title').trim(),
        content: fd.get('content').trim(),
        category: fd.get('category'),
        color: fd.get('color') || 'delicate-blue',
        pinned: fd.get('pinned') === 'on',
        updatedAt: toDateStr()
      };
      if (existingId) {
        const idx = state.notes.findIndex(n => n.id === existingId);
        if (idx !== -1) state.notes[idx] = { ...state.notes[idx], ...data };
        showToast('Заметка обновлена');
      } else {
        state.notes.unshift({ id: uid('n'), ...data });
        showToast('Заметка сохранена');
      }
      saveState(); closeModal(); renderView();
    }

    /* ==========================================================================
       14. РАЗДЕЛ 8: ЦИКЛ (MARY'S ROSE & HUSHED VIOLET)
       ========================================================================== */
    function renderCycleView() {
      const today = toDateStr();
      const info = getCycleOverview(today);
      const y = ui.cycleYear, m = ui.cycleMonth;
      const firstDay = new Date(y, m, 1);
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const offset = (firstDay.getDay() + 6) % 7;

      const r = 56, circ = 2 * Math.PI * r;
      const ratio = info.hasData ? Math.min(1, info.dayOfCycle / info.cycleLen) : 0;
      const dashOffset = circ * (1 - ratio);

      const sel = ui.cycleSelectedDate;
      const dayLog = state.cycle.logs[sel] || { tags: [], note: '' };
      const isSelLogged = state.cycle.periodDays.includes(sel);

      const cells = [];
      for (let i = 0; i < offset; i++) cells.push('<div></div>');
      for (let d = 1; d <= daysInMonth; d++) {
        const dStr = `${y}-${pad2(m + 1)}-${pad2(d)}`;
        const st = getCycleDateStatus(dStr);
        const cls = st?.type === 'logged' ? 'logged' : st?.type === 'predicted' ? 'predicted' : st?.type === 'ovulation' ? 'ovulation' : '';
        const hasLog = Boolean(state.cycle.logs[dStr]?.tags?.length || state.cycle.logs[dStr]?.note);
        cells.push(`
          <button onclick="ui.cycleSelectedDate='${dStr}'; renderView();" class="cycle-day-btn ${cls} ${dStr === sel ? 'selected' : ''}" style="${dStr === today ? 'text-decoration:underline;' : ''}">
            <span>${d}</span>
            ${hasLog ? '<span class="dot" style="width:5px;height:5px;background:var(--p-hushed-violet-ink);margin-top:2px;"></span>' : ''}
          </button>
        `);
      }

      const history = [...(info.episodes || [])].reverse().map((ep, i, arr) => ({
        ...ep, duration: i > 0 ? diffDays(ep.start, arr[i - 1].start) : null
      }));

      return `
        <div class="view-enter stack">
          <div class="page-header">
            <div>
              <div class="eyebrow">Бережное наблюдение</div>
              <h1 class="page-title">Цикл</h1>
            </div>
            <button onclick="logPeriodToday()" class="btn btn-pastel-rose btn-sm">
              ${iconSvg('<path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>', 17)}
              <span>${info.isLoggedToday ? 'Снять отметку за сегодня' : 'Начались сегодня'}</span>
            </button>
          </div>

          <div class="card" style="background: linear-gradient(145deg, #FFFFFF, rgba(243,225,229,0.58)); padding: 26px;">
            ${info.hasData ? `
              <div class="row" style="gap: 28px; flex-wrap: wrap;">
                <div style="position:relative; width:136px; height:136px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                  <svg width="136" height="136" viewBox="0 0 132 132" style="transform: rotate(-90deg);">
                    <circle cx="66" cy="66" r="${r}" fill="none" stroke="rgba(210,193,200,0.45)" stroke-width="8" />
                    <circle cx="66" cy="66" r="${r}" fill="none" stroke="${info.phase.ring}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${dashOffset}" />
                  </svg>
                  <div style="position:absolute; text-align:center;">
                    <div class="text-xs muted" style="text-transform:uppercase;">День</div>
                    <div style="font-size:38px; font-weight:700; line-height:0.95;">${info.dayOfCycle}</div>
                    <div class="text-xs muted">из ${info.cycleLen}</div>
                  </div>
                </div>

                <div style="flex:1; min-width:240px;">
                  <span class="badge" style="background:${info.phase.bg}; color:${info.phase.ink}; font-size:15px;">${info.phase.name}</span>
                  <h2 style="font-size:30px; margin-top:8px;">
                    ${info.isLate ? `Задержка ${pluralDays(info.lateDays)}` : info.daysUntilNext === 0 ? 'Прогноз начала — сегодня' : `До следующего цикла ~${pluralDays(info.daysUntilNext)}`}
                  </h2>
                  <p class="muted" style="margin-top:8px; font-size:18px;">${info.phase.desc}</p>
                  <div class="row" style="gap:20px; flex-wrap:wrap; margin-top:14px; padding-top:12px; border-top:1px solid var(--border); font-size:16px;">
                    <span>Прогноз начала: <strong>${formatHumanDate(info.nextPeriodStart)}</strong></span>
                    <span>Окно овуляции: <strong>~${formatHumanDate(info.ovulationDate)}</strong></span>
                  </div>
                </div>
              </div>
            ` : `<p class="muted" style="text-align:center; padding:16px 0;">Отметьте первый день менструации кнопкой выше или в календаре ниже.</p>`}
          </div>

          <div class="grid-split">
            <div class="stack">
              <div class="card">
                <div class="row-between" style="margin-bottom:12px;">
                  <h3 style="font-size:24px;">${MONTHS_RU[m]} ${y}</h3>
                  <div class="row" style="gap:4px;">
                    <button onclick="shiftCycleMonth(-1)" class="icon-btn sm ghost">${iconSvg('<polyline points="15 18 9 12 15 6"/>', 17)}</button>
                    <button onclick="shiftCycleMonth(1)" class="icon-btn sm ghost">${iconSvg('<polyline points="9 18 15 12 9 6"/>', 17)}</button>
                  </div>
                </div>
                <div class="cal-grid" style="margin-bottom:6px;">
                  ${WEEKDAYS_SHORT_MON.map(w => `<div class="cal-weekday">${w}</div>`).join('')}
                </div>
                <div class="cal-grid">${cells.join('')}</div>
                <div class="row-between" style="margin-top:14px; padding-top:14px; border-top:1px solid var(--border);">
                  <span class="text-sm">Дата: <strong>${formatHumanDate(sel)}</strong></span>
                  <button onclick="togglePeriodDay('${sel}')" class="btn btn-sm ${isSelLogged ? 'btn-primary' : 'btn-pastel-rose'}">
                    ${isSelLogged ? 'Снять отметку' : 'Отметить день менструации'}
                  </button>
                </div>
              </div>

              <div class="card">
                <h3 style="font-size:22px; margin-bottom:12px;">Настройки расчёта</h3>
                <div class="grid-2">
                  <div>
                    <label class="field-label">Средняя длина цикла (дн.)</label>
                    <input type="number" min="20" max="45" class="input" value="${state.cycle.cycleLength}" onchange="updateCycleParam('cycleLength', this.value)" />
                  </div>
                  <div>
                    <label class="field-label">Длительность менструации (дн.)</label>
                    <input type="number" min="2" max="10" class="input" value="${state.cycle.periodLength}" onchange="updateCycleParam('periodLength', this.value)" />
                  </div>
                </div>
              </div>
            </div>

            <div class="stack">
              <div class="card stack-sm">
                <div>
                  <div class="eyebrow">Самочувствие · ${formatShortDate(sel)}</div>
                  <h3 style="font-size:24px;">Настроение и симптомы</h3>
                </div>
                <div class="pills-row">
                  ${SYMPTOM_TAGS.map(tag => {
                    const on = dayLog.tags.includes(tag);
                    return `
                      <button onclick="toggleCycleTag('${sel}', '${tag}')" class="pill-tab" style="padding:6px 13px; font-size:15px; background:${on ? 'var(--p-marys-rose)' : '#FFFFFF'}; color:${on ? 'var(--p-marys-rose-ink)' : 'var(--ink-muted)'}; border-color:${on ? '#CE959E' : 'var(--border)'};">${tag}</button>
                    `;
                  }).join('')}
                </div>
                <div>
                  <label class="field-label">Заметка на ${formatHumanDate(sel)}</label>
                  <textarea id="cycle-note-input" class="input" rows="3" placeholder="Как вы себя чувствуете сегодня?">${esc(dayLog.note || '')}</textarea>
                  <button onclick="saveCycleNote('${sel}')" class="btn btn-secondary btn-sm" style="width:100%; margin-top:8px;">Сохранить заметку</button>
                </div>
              </div>

              <div class="card">
                <h3 style="font-size:22px; margin-bottom:10px;">История циклов</h3>
                ${history.length ? history.map(ep => `
                  <div class="row-between" style="padding:8px 0; border-bottom:1px solid var(--border); font-size:16px;">
                    <div>
                      <div style="font-weight:700;">${formatHumanDate(ep.start)} — ${formatHumanDate(ep.end)}</div>
                      <div class="text-xs muted">Длительность: ${pluralDays(ep.length)}</div>
                    </div>
                    <span class="badge" style="background:var(--p-heavenly-pink); color:var(--p-marys-rose-ink);">${ep.duration ? `Цикл ${ep.duration} дн.` : 'Текущий'}</span>
                  </div>
                `).join('') : `<p class="muted text-sm">История пока пуста.</p>`}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function shiftCycleMonth(d) { const dt = new Date(ui.cycleYear, ui.cycleMonth + d, 1); ui.cycleYear = dt.getFullYear(); ui.cycleMonth = dt.getMonth(); renderView(); }
    function togglePeriodDay(dateStr) {
      const i = state.cycle.periodDays.indexOf(dateStr);
      if (i !== -1) state.cycle.periodDays.splice(i, 1);
      else { state.cycle.periodDays.push(dateStr); state.cycle.periodDays.sort(); }
      saveState(); renderView();
    }
    function logPeriodToday() {
      const today = toDateStr();
      togglePeriodDay(today);
      ui.cycleSelectedDate = today;
      showToast(state.cycle.periodDays.includes(today) ? 'Отмечено начало цикла сегодня' : 'Отметка снята', 'var(--p-marys-rose)');
    }
    function updateCycleParam(key, val) {
      const n = parseInt(val, 10);
      if (isNaN(n)) return;
      state.cycle[key] = key === 'cycleLength' ? Math.max(20, Math.min(45, n)) : Math.max(2, Math.min(10, n));
      saveState(); renderView(); showToast('Прогноз обновлён');
    }
    function toggleCycleTag(dateStr, tag) {
      state.cycle.logs[dateStr] = state.cycle.logs[dateStr] || { tags: [], note: '' };
      const arr = state.cycle.logs[dateStr].tags;
      const idx = arr.indexOf(tag);
      if (idx !== -1) arr.splice(idx, 1); else arr.push(tag);
      saveState(); renderView();
    }
    function saveCycleNote(dateStr) {
      const el = document.getElementById('cycle-note-input');
      if (!el) return;
      state.cycle.logs[dateStr] = state.cycle.logs[dateStr] || { tags: [], note: '' };
      state.cycle.logs[dateStr].note = el.value.trim();
      saveState(); renderView(); showToast('Заметка о самочувствии сохранена', 'var(--p-marys-rose)');
    }

    /* ==========================================================================
       15. РАЗДЕЛ 9: ФИНАНСЫ (₽)
       ========================================================================== */
    function renderFinanceView() {
      const y = ui.finYear, m = ui.finMonth;
      const ym = `${y}-${pad2(m + 1)}`;
      const monthTx = state.transactions.filter(t => t.date.startsWith(ym)).sort((a, b) => b.date.localeCompare(a.date));
      const inc = monthTx.filter(t => t.type === 'income').reduce((s, x) => s + Number(x.amount), 0);
      const exp = monthTx.filter(t => t.type === 'expense').reduce((s, x) => s + Number(x.amount), 0);
      const bal = inc - exp;

      const byCat = {};
      monthTx.filter(t => t.type === 'expense').forEach(t => byCat[t.category] = (byCat[t.category] || 0) + Number(t.amount));
      const catRows = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
      const visibleTx = ui.finFilter === 'all' ? monthTx : monthTx.filter(t => t.type === ui.finFilter);
      const defaultDate = toDateStr().startsWith(ym) ? toDateStr() : `${ym}-01`;
      const cats = ui.finFormType === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;

      return `
        <div class="view-enter stack">
          <div class="page-header">
            <div>
              <div class="eyebrow">Спокойный учёт</div>
              <h1 class="page-title">Финансы</h1>
            </div>
            <div class="card row" style="padding: 6px; border-radius: 14px; gap: 4px;">
              <button onclick="shiftFinMonth(-1)" class="icon-btn sm ghost">${iconSvg('<polyline points="15 18 9 12 15 6"/>', 17)}</button>
              <span style="padding: 0 12px; font-weight:700;">${MONTHS_RU[m]} ${y}</span>
              <button onclick="shiftFinMonth(1)" class="icon-btn sm ghost">${iconSvg('<polyline points="9 18 15 12 9 6"/>', 17)}</button>
            </div>
          </div>

          <div class="grid-3">
            <div class="card" style="background: linear-gradient(145deg, #FFFFFF, rgba(198,216,240,0.52));">
              <div class="text-sm muted">Баланс месяца</div>
              <div style="font-size:32px; font-weight:700; margin-top:4px;">${formatCurrency(bal)}</div>
            </div>
            <div class="card" style="background: linear-gradient(145deg, #FFFFFF, rgba(181,211,190,0.45));">
              <div class="text-sm muted">Доходы</div>
              <div style="font-size:32px; font-weight:700; color:var(--p-gossamer-green-ink); margin-top:4px;">+${formatCurrency(inc)}</div>
            </div>
            <div class="card" style="background: linear-gradient(145deg, #FFFFFF, rgba(247,214,218,0.52));">
              <div class="text-sm muted">Расходы</div>
              <div style="font-size:32px; font-weight:700; color:var(--p-marys-rose-ink); margin-top:4px;">−${formatCurrency(exp)}</div>
            </div>
          </div>

          <div class="grid-split reverse">
            <div class="stack">
              <div class="card">
                <h3 style="font-size:24px; margin-bottom:14px;">Новая запись</h3>
                <form onsubmit="addTxForm(event)" class="stack-sm">
                  <div class="grid-2" style="gap:8px;">
                    <button type="button" onclick="ui.finFormType='expense'; renderView();" class="btn btn-sm" style="background:${ui.finFormType === 'expense' ? 'var(--p-hushed-violet)' : 'var(--bg-subtle)'}; color:var(--ink-main);">Расход</button>
                    <button type="button" onclick="ui.finFormType='income'; renderView();" class="btn btn-sm" style="background:${ui.finFormType === 'income' ? 'var(--p-gossamer-green)' : 'var(--bg-subtle)'}; color:var(--ink-main);">Доход</button>
                  </div>
                  <div class="grid-2">
                    <div>
                      <label class="field-label">Сумма (₽)</label>
                      <input type="number" name="amount" min="1" step="any" required class="input" placeholder="1 500" />
                    </div>
                    <div>
                      <label class="field-label">Дата</label>
                      <input type="date" name="date" required value="${defaultDate}" class="input" />
                    </div>
                  </div>
                  <div>
                    <label class="field-label">Категория</label>
                    <select name="category" class="input">
                      ${cats.map(c => `<option value="${c}">${c}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="field-label">Комментарий</label>
                    <input type="text" name="comment" class="input" placeholder="Например: Книга и кофе" />
                  </div>
                  <button type="submit" class="btn btn-primary btn-sm" style="width:100%;">Добавить ${ui.finFormType === 'income' ? 'доход' : 'расход'}</button>
                </form>
              </div>

              <div class="card">
                <h3 style="font-size:24px; margin-bottom:14px;">Структура расходов</h3>
                ${catRows.length ? `
                  <div class="stack-sm">
                    ${catRows.map(([cat, sum]) => {
                      const pct = exp ? Math.round((sum / exp) * 100) : 0;
                      return `
                        <div>
                          <div class="row-between" style="font-size:16px; margin-bottom:4px;">
                            <span>${esc(cat)}</span>
                            <span><strong>${formatCurrency(sum)}</strong> · ${pct}%</span>
                          </div>
                          <div class="progress-track">
                            <div class="progress-fill" style="width:${pct}%; background: linear-gradient(90deg, var(--p-hushed-violet), var(--p-marys-rose));"></div>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                ` : `<p class="muted text-sm">В этом месяце расходов пока нет.</p>`}
              </div>
            </div>

            <div class="card">
              <div class="card-header">
                <h3 style="font-size:24px;">История операций</h3>
                <div class="pills-row">
                  ${[['all', 'Все'], ['income', 'Доходы'], ['expense', 'Расходы']].map(([f, lbl]) => `
                    <button onclick="ui.finFilter='${f}'; renderView();" class="pill-tab ${ui.finFilter === f ? 'active' : ''}" style="padding:5px 12px; font-size:15px;">${lbl}</button>
                  `).join('')}
                </div>
              </div>

              ${visibleTx.length ? visibleTx.map(tx => {
                const isInc = tx.type === 'income';
                return `
                  <div class="row-between" style="padding: 11px 0; border-bottom: 1px solid var(--border);">
                    <div class="row" style="gap:12px;">
                      <span style="width:36px;height:36px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:${isInc ? 'var(--p-gossamer-green)' : 'var(--p-marys-rose)'}; color:${isInc ? 'var(--p-gossamer-green-ink)' : 'var(--p-marys-rose-ink)'};">
                        ${isInc ? iconSvg('<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>', 16) : iconSvg('<line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>', 16)}
                      </span>
                      <div>
                        <div style="font-size:18px; font-weight:700;">${esc(tx.category)}</div>
                        <div class="text-sm muted">${formatShortDate(tx.date)}${tx.comment ? ` · ${esc(tx.comment)}` : ''}</div>
                      </div>
                    </div>
                    <div class="row" style="gap:8px;">
                      <span style="font-size:19px; font-weight:700; color:${isInc ? 'var(--p-gossamer-green-ink)' : 'var(--p-marys-rose-ink)'};">${isInc ? '+' : '−'}${formatCurrency(tx.amount)}</span>
                      <button onclick="deleteTx('${tx.id}')" class="icon-btn sm ghost danger">${iconSvg('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>', 15)}</button>
                    </div>
                  </div>
                `;
              }).join('') : `<p class="muted" style="text-align:center; padding:26px 0;">За этот месяц операций пока нет.</p>`}
            </div>
          </div>
        </div>
      `;
    }

    function shiftFinMonth(d) { const dt = new Date(ui.finYear, ui.finMonth + d, 1); ui.finYear = dt.getFullYear(); ui.finMonth = dt.getMonth(); renderView(); }
    function addTxForm(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const amount = parseFloat(fd.get('amount'));
      if (!amount || amount <= 0) return;
      const dateStr = fd.get('date');
      state.transactions.unshift({ id: uid('tx'), type: ui.finFormType, amount, category: fd.get('category'), date: dateStr, comment: fd.get('comment').trim() });
      const d = parseDateStr(dateStr);
      ui.finYear = d.getFullYear(); ui.finMonth = d.getMonth();
      saveState(); renderView();
      showToast(ui.finFormType === 'income' ? 'Доход записан' : 'Расход записан', ui.finFormType === 'income' ? 'var(--p-gossamer-green)' : 'var(--p-marys-rose)');
    }
    async function deleteTx(id) {
      if (!(await askConfirm('Удалить операцию?', 'Запись исчезнет из истории финансов.'))) return;
      state.transactions = state.transactions.filter(t => t.id !== id);
      saveState(); renderView(); showToast('Операция удалена');
    }

    /* ==========================================================================
       16. РАЗДЕЛ 10: НАСТРОЙКИ И МОДУЛИ
       ========================================================================== */
    function renderSettingsView() {
      const themes = [
        { id: 'powder', name: 'Пудровый голубой', desc: 'Powder Blue #C6D8F0 и Endless Sky', swatches: ['#C6D8F0', '#7D94B5', '#F4F3E8', '#F7D6DA'] },
        { id: 'cream', name: 'Кремовая пена', desc: 'Тёплый Cappucino Foam и Pastel Yellow', swatches: ['#F4F3E8', '#F2E9B1', '#C6D8F0', '#B5D3BE'] },
        { id: 'lavender', name: 'Нежная лаванда', desc: 'Orchid Petal и воздушный Heavenly Pink', swatches: ['#C5B7D1', '#F3E1E5', '#D2C1C8', '#7D94B5'] }
      ];
      const toggleable = MODULES_META.filter(m => !m.alwaysVisible);
      const ideas = state.settings.moduleIdeas || [];

      return `
        <div class="view-enter stack" style="max-width: 900px;">
          <div class="page-header">
            <div>
              <div class="eyebrow">Персонализация</div>
              <h1 class="page-title">Настройки</h1>
            </div>
          </div>

          <!-- 3 пастельные темы -->
          <section class="card stack-sm">
            <div>
              <h2 class="section-title">Пастельная тема</h2>
              <p class="text-sm muted">Выберите настроение фона вашего ежедневника</p>
            </div>
            <div class="grid-3">
              ${themes.map(th => {
                const active = state.settings.theme === th.id;
                return `
                  <button onclick="setTheme('${th.id}')" class="card" style="text-align:left; padding:16px; border: ${active ? '2px solid var(--accent)' : '1px solid var(--border)'}; background:#FFFFFF;">
                    <div class="row" style="gap:6px; margin-bottom:12px;">
                      ${th.swatches.map(hex => `<span class="pantone-swatch" style="background:${hex}; border-radius:50%;"></span>`).join('')}
                    </div>
                    <div style="font-size:20px; font-weight:700;">${th.name}</div>
                    <div class="text-sm muted" style="margin-top:3px;">${th.desc}</div>
                  </button>
                `;
              }).join('')}
            </div>
          </section>

          <!-- Иконка для рабочего стола телефона и полноэкранный режим -->
          <section class="card stack-sm">
            <div>
              <h2 class="section-title">Иконка для экрана телефона</h2>
              <p class="text-sm muted">Включён полноэкранный режим без строки браузера — выберите, как значок «Мой ритм» будет выглядеть на вашем рабочем столе</p>
            </div>
            <div class="row" style="gap: 24px; flex-wrap: wrap; align-items: center;">
              <div style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 22px; border-radius:20px; background:var(--bg-subtle); border:1px solid var(--border);">
                <canvas id="icon-preview-canvas" width="240" height="240" style="width:104px; height:104px; border-radius:24px; box-shadow: 0 10px 26px rgba(67,86,117,0.22);"></canvas>
                <span style="font-size:15px; font-weight:700; color:var(--ink-main);">Мой ритм</span>
              </div>

              <div style="flex:1; min-width:240px;" class="stack-sm">
                <div class="pills-row">
                  ${Object.values(ICON_STYLES).map(ic => {
                    const active = (state.settings.iconStyle || 'powder') === ic.id;
                    return `
                      <button onclick="setIconStyle('${ic.id}')" class="pill-tab ${active ? 'active' : ''}">
                        <span class="dot" style="background:${ic.themeHex}; border:1px solid rgba(38,48,64,0.18); width:11px; height:11px;"></span>
                        <span>${ic.name}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
                <p class="text-sm muted">Иконка автоматически подхватится браузером при нажатии «Добавить на главный экран». Также вы можете скачать её в высоком качестве (512×512 PNG).</p>
                <div>
                  <button onclick="downloadAppIcon()" class="btn btn-secondary btn-sm">
                    ${iconSvg('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>', 16)}
                    <span>Скачать иконку (PNG)</span>
                  </button>
                </div>
              </div>
            </div>
          </section>

          <!-- Включение и выключение разделов -->
          <section class="card stack-sm">
            <div>
              <h2 class="section-title">Разделы в меню</h2>
              <p class="text-sm muted">Оставляйте в навигации только нужные вам модули</p>
            </div>
            <div class="grid-2">
              ${toggleable.map(m => {
                const on = isModuleEnabled(m.id);
                return `
                  <div class="row-between" style="padding:12px 14px; border-radius:14px; background:#FFFFFF; border:1px solid var(--border);">
                    <div class="row" style="gap:10px;">
                      ${iconSvg(m.icon, 18)}
                      <span style="font-size:18px; font-weight:600;">${m.label}</span>
                    </div>
                    <button onclick="toggleModule('${m.id}')" class="toggle ${on ? 'on' : ''}" aria-label="${m.label}">
                      <span class="toggle-knob"></span>
                    </button>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="divider"></div>
            <div>
              <div style="font-size:18px; font-weight:700; margin-bottom:8px;">Идеи для будущих разделов</div>
              <form onsubmit="addModuleIdea(event)" class="row">
                <input type="text" name="idea" class="input" placeholder="Например: Трекер ухода, План путешествий..." />
                <button type="submit" class="btn btn-secondary btn-sm">Записать</button>
              </form>
              ${ideas.length ? `
                <div class="pills-row" style="margin-top:12px;">
                  ${ideas.map((idea, idx) => `
                    <span class="badge" style="background:var(--p-cappucino-foam); border:1px solid var(--border); padding:5px 12px; font-size:16px;">
                      ${esc(idea)}
                      <button onclick="removeModuleIdea(${idx})" style="margin-left:6px; font-size:18px; color:var(--ink-muted);">×</button>
                    </span>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          </section>

          <!-- Экспорт / Импорт -->
          <section class="card stack-sm">
            <div>
              <h2 class="section-title">Резервная копия данных</h2>
              <p class="text-sm muted">Все ваши задачи, книги, цитаты, фильмы, заметки, цикл и финансы сохраняются локально и выгружаются одним файлом JSON.</p>
            </div>
            <div class="row" style="flex-wrap:wrap;">
              <button onclick="exportBackupJSON()" class="btn btn-primary btn-sm">Скачать резервную копию (JSON)</button>
              <button onclick="document.getElementById('json-import-input').click()" class="btn btn-secondary btn-sm">Загрузить из JSON</button>
              <button onclick="restoreDemo()" class="btn btn-secondary btn-sm">Восстановить примеры</button>
              <button onclick="clearAll()" class="btn btn-pastel-rose btn-sm">Очистить всё</button>
            </div>
          </section>
        </div>
      `;
    }

    function toggleModule(id) { state.settings.modules[id] = !isModuleEnabled(id); saveState(); renderAll(); }
    function addModuleIdea(e) {
      e.preventDefault();
      const inp = e.target.querySelector('input[name="idea"]');
      const val = inp.value.trim();
      if (!val) return;
      state.settings.moduleIdeas = state.settings.moduleIdeas || [];
      state.settings.moduleIdeas.push(val);
      saveState(); renderView(); showToast('Идея сохранена');
    }
    function removeModuleIdea(i) { state.settings.moduleIdeas.splice(i, 1); saveState(); renderView(); }

    function exportBackupJSON() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `moi-ritm-pastel-${toDateStr()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      showToast('Резервная копия скачана', 'var(--p-gossamer-green)');
    }

    function handleImportFile(e) {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.tasks)) {
            showToast('Неподходящий формат JSON', 'var(--p-marys-rose)'); return;
          }
          if (!(await askConfirm('Загрузить резервную копию?', 'Текущие данные будут заменены содержимым файла.', 'Загрузить'))) return;
          const base = createEmptyState();
          state = {
            ...base, ...parsed,
            settings: { ...base.settings, ...(parsed.settings || {}), modules: { ...base.settings.modules, ...(parsed.settings?.modules || {}) } },
            cycle: { ...base.cycle, ...(parsed.cycle || {}) }
          };
          saveState(); renderAll(); showToast('Данные восстановлены', 'var(--p-gossamer-green)');
        } catch { showToast('Ошибка чтения файла', 'var(--p-marys-rose)'); }
      };
      reader.readAsText(file);
    }

    async function restoreDemo() {
      if (!(await askConfirm('Восстановить примеры?', 'Текущие записи будут заменены стартовыми примерами.', 'Восстановить'))) return;
      const theme = state.settings.theme;
      state = createDemoState(); state.settings.theme = theme;
      saveState(); renderAll(); showToast('Примеры восстановлены');
    }

    async function clearAll() {
      if (!(await askConfirm('Начать с чистого листа?', 'Все задачи, книги, фильмы, заметки, цикл и финансы будут очищены.', 'Очистить всё'))) return;
      const theme = state.settings.theme, mods = { ...state.settings.modules };
      state = createEmptyState(); state.settings.theme = theme; state.settings.modules = mods;
      saveState(); renderAll(); showToast('Ежедневник очищен');
    }

    /* ==========================================================================
       17. РЕНДЕРИНГ И ЗАПУСК
       ========================================================================== */
    function renderView() {
      const el = document.getElementById('app-view');
      switch (ui.route) {
        case 'today': el.innerHTML = renderTodayView(); break;
        case 'tasks': el.innerHTML = renderTasksView(); break;
        case 'calendar': el.innerHTML = renderCalendarView(); break;
        case 'habits': el.innerHTML = renderHabitsView(); break;
        case 'movies': el.innerHTML = renderMoviesView(); break;
        case 'books': el.innerHTML = renderBooksView(); break;
        case 'notes': el.innerHTML = renderNotesView(); break;
        case 'cycle': el.innerHTML = renderCycleView(); break;
        case 'finance': el.innerHTML = renderFinanceView(); break;
        case 'settings': el.innerHTML = renderSettingsView(); break;
        default: el.innerHTML = renderTodayView();
      }
      if (ui.route === 'settings') renderIconPreviewCanvas();
    }

    function renderAll() {
      applyAtmosphere();
      renderNavigation();
      renderView();
    }

    renderAll();
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        applyPwaIconAndManifest();
        renderIconPreviewCanvas();
      });
    }
  </script>
</body>
</html>
