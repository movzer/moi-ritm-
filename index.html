  <style>
    /* ==========================================================================
       1. PANTONE PASTEL PALETTE & THEME TOKENS
       ========================================================================== */
    :root {
      /* 9 официальных оттенков Pantone */
      --p-delicate-blue: #C6D8F0;
      --p-endless-sky: #7D94B5;
      --p-endless-sky-dark: #637B9E;
      --p-marys-rose: #F7D6DA;
      --p-marys-rose-ink: #8E4E59;
      --p-gossamer-green: #B5D3BE;
      --p-gossamer-green-ink: #3E664B;
      --p-pastel-yellow: #F2E9B1;
      --p-pastel-yellow-ink: #7A6724;
      --p-orchid-petal: #C5B7D1;
      --p-orchid-petal-ink: #5B4A6E;
      --p-heavenly-pink: #F3E1E5;
      --p-cappucino-foam: #F4F3E8;
      --p-hushed-violet: #D2C1C8;
      --p-hushed-violet-ink: #6E5260;

      /* Типографика и базовый контраст */
      --font-main: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      --ink-main: #263040;
      --ink-muted: #556275;
      --ink-faint: #7A8799;

      /* Сферы */
      --c-work: #7D94B5;
      --c-work-soft: rgba(125, 148, 181, 0.16);
      --c-personal: #F7D6DA;
      --c-personal-ink: #8E4E59;
      --c-personal-soft: rgba(247, 214, 218, 0.55);
      --c-interests: #C5B7D1;
      --c-interests-ink: #5B4A6E;
      --c-interests-soft: rgba(197, 183, 209, 0.34);

      /* Радиусы и тени */
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 24px;
      --radius-pill: 999px;
      --shadow-soft: 0 8px 28px rgba(67, 86, 117, 0.07);
      --shadow-hover: 0 12px 32px rgba(67, 86, 117, 0.11);
      --shadow-modal: 0 22px 60px rgba(38, 48, 64, 0.18);
    }

    /* Тема 1 (по умолчанию): Пудровый голубой (Powder Blue) */
    [data-theme="powder"] {
      --bg-page: linear-gradient(155deg, #E8F0FA 0%, #D9E6F7 48%, #F4F3E8 100%);
      --bg-solid: #E1ECFA;
      --bg-sidebar: rgba(235, 243, 252, 0.9);
      --bg-card: rgba(255, 255, 255, 0.88);
      --bg-card-solid: #FFFFFF;
      --bg-subtle: rgba(198, 216, 240, 0.34);
      --bg-hover: rgba(198, 216, 240, 0.52);
      --bg-input: #FFFFFF;
      --border: rgba(125, 148, 181, 0.28);
      --border-strong: rgba(125, 148, 181, 0.5);
      --accent: #7D94B5;
      --accent-hover: #657DA0;
      --accent-soft: #C6D8F0;
    }

    /* Тема 2: Кремовая пена (Cappucino Foam) */
    [data-theme="cream"] {
      --bg-page: linear-gradient(155deg, #F8F7F0 0%, #F4F3E8 55%, #EBF2FB 100%);
      --bg-solid: #F4F3E8;
      --bg-sidebar: rgba(248, 247, 240, 0.94);
      --bg-card: rgba(255, 255, 255, 0.92);
      --bg-card-solid: #FFFFFF;
      --bg-subtle: rgba(242, 233, 177, 0.32);
      --bg-hover: rgba(198, 216, 240, 0.36);
      --bg-input: #FFFEFA;
      --border: rgba(125, 148, 181, 0.24);
      --border-strong: rgba(125, 148, 181, 0.46);
      --accent: #7D94B5;
      --accent-hover: #657DA0;
      --accent-soft: #F2E9B1;
    }

    /* Тема 3: Нежная лаванда (Orchid Petal) */
    [data-theme="lavender"] {
      --bg-page: linear-gradient(155deg, #F2EEF7 0%, #E9E2F2 50%, #F3E1E5 100%);
      --bg-solid: #EDE7F4;
      --bg-sidebar: rgba(243, 238, 249, 0.92);
      --bg-card: rgba(255, 255, 255, 0.88);
      --bg-card-solid: #FFFFFF;
      --bg-subtle: rgba(197, 183, 209, 0.32);
      --bg-hover: rgba(197, 183, 209, 0.48);
      --bg-input: #FFFFFF;
      --border: rgba(154, 134, 173, 0.28);
      --border-strong: rgba(125, 148, 181, 0.5);
      --accent: #7D94B5;
      --accent-hover: #647BA0;
      --accent-soft: #C5B7D1;
    }

    /* Вечерний режим: уютный лавандово-голубой тон */
    [data-evening="true"] {
      --bg-page: linear-gradient(155deg, #DFE3F2 0%, #DFD6EB 52%, #E8DCE4 100%);
      --bg-solid: #DFD9EC;
      --bg-sidebar: rgba(226, 222, 240, 0.92);
      --bg-card: rgba(252, 250, 255, 0.88);
      --bg-subtle: rgba(197, 183, 209, 0.38);
      --border: rgba(114, 102, 142, 0.28);
    }

    /* ==========================================================================
       2. GLOBAL TYPOGRAPHY (CORMORANT GARAMOND EVERYWHERE) & BASE RESET
       ========================================================================== */
    *, *::before, *::after,
    html, body, h1, h2, h3, h4, h5, h6,
    p, span, a, div, ul, ol, li,
    button, input, textarea, select, option, label,
    table, th, td, blockquote {
      font-family: var(--font-main);
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 18px;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--bg-page);
      background-attachment: fixed;
      color: var(--ink-main);
      font-weight: 500;
      line-height: 1.48;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      transition: background 0.35s ease, color 0.25s ease;
    }

    h1, h2, h3, h4 {
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--ink-main);
      line-height: 1.15;
    }

    p { margin: 0; }

    button {
      cursor: pointer;
      border: none;
      background: transparent;
      color: inherit;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.25;
      padding: 0;
      transition: all 0.2s ease;
    }

    input, textarea, select, option {
      font-size: 18px;
      font-weight: 500;
      color: var(--ink-main);
      line-height: 1.4;
    }

    /* Стилизованный скроллбар */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(125, 148, 181, 0.38); border-radius: 99px; }

    /* ==========================================================================
       3. APP SHELL LAYOUT (SIDEBAR + MAIN + MOBILE HEADER & NAV)
       ========================================================================== */
    .app-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* Сайдбар на ПК */
    .sidebar {
      display: none;
    }

    @media (min-width: 1024px) {
      .sidebar {
        display: flex;
        flex-direction: column;
        width: 268px;
        position: fixed;
        inset: 0 auto 0 0;
        background: var(--bg-sidebar);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-right: 1px solid var(--border);
        z-index: 30;
        padding: 26px 16px 20px;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 10px 22px;
      cursor: pointer;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--p-delicate-blue), var(--p-orchid-petal));
      border: 1px solid rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-main);
      box-shadow: 0 4px 12px rgba(125, 148, 181, 0.22);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 27px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1;
    }

    .brand-sub {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--ink-muted);
      margin-top: 3px;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 2px;
    }

    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
      color: var(--ink-muted);
      text-align: left;
      border: 1px solid transparent;
    }

    .nav-btn:hover {
      background: var(--bg-subtle);
      color: var(--ink-main);
    }

    .nav-btn.active {
      background: var(--bg-card-solid);
      color: var(--ink-main);
      border-color: var(--border);
      box-shadow: 0 4px 14px rgba(125, 148, 181, 0.14);
    }

    .nav-btn.active .nav-icon {
      color: var(--accent);
    }

    .sidebar-footer {
      padding-top: 14px;
      margin-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .evening-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      font-size: 16px;
      font-weight: 600;
    }

    .evening-chip:hover { background: var(--bg-hover); }

    /* Мобильная шапка */
    .mobile-header {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
      background: var(--bg-sidebar);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    @media (min-width: 1024px) {
      .mobile-header { display: none; }
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--ink-main);
    }

    .icon-btn:hover { background: var(--bg-hover); }
    .icon-btn.sm { width: 34px; height: 34px; border-radius: 10px; }
    .icon-btn.ghost { background: transparent; border-color: transparent; color: var(--ink-muted); }
    .icon-btn.ghost:hover { background: var(--bg-subtle); color: var(--ink-main); }
    .icon-btn.danger:hover { background: var(--p-marys-rose); color: var(--p-marys-rose-ink); }

    /* Основной контент */
    .main-area {
      flex: 1;
      width: 100%;
      padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
    }

    @media (min-width: 1024px) {
      .main-area {
        padding-left: 268px;
        padding-bottom: 56px;
      }
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 22px 16px;
    }

    @media (min-width: 640px) {
      .container { padding: 30px 28px; }
    }

    @media (min-width: 1024px) {
      .container { padding: 36px 40px; }
    }

    /* Мобильная нижняя панель */
    .mobile-bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 35;
      background: var(--bg-sidebar);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-top: 1px solid var(--border);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    }

    @media (min-width: 1024px) {
      .mobile-bottom-nav { display: none; }
    }

    .mobile-nav-grid {
      display: grid;
      gap: 4px;
    }

    .mnav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 6px 2px;
      border-radius: 12px;
      color: var(--ink-muted);
      font-size: 13px;
      font-weight: 600;
    }

    .mnav-btn.active {
      color: var(--ink-main);
      background: var(--bg-card-solid);
      box-shadow: 0 2px 8px rgba(125, 148, 181, 0.15);
    }

    /* ==========================================================================
       4. REUSABLE UI PRIMITIVES (CARDS, BUTTONS, INPUTS, GRIDS, PILLS)
       ========================================================================== */
    .view-enter {
      animation: fadeLift 0.28s ease-out;
    }

    @keyframes fadeLift {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .eyebrow {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--ink-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .page-title {
      font-size: clamp(32px, 5vw, 44px);
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .section-title {
      font-size: 25px;
      font-weight: 600;
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-soft);
      padding: 20px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card.clickable { cursor: pointer; }
    .card.clickable:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: var(--border-strong);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    /* Кнопки */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      min-height: 42px;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(125, 148, 181, 0.28);
    }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    .btn-secondary {
      background: var(--bg-card-solid);
      color: var(--ink-main);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--bg-hover); border-color: var(--border-strong); }

    .btn-pastel-rose {
      background: var(--p-marys-rose);
      color: var(--p-marys-rose-ink);
      border: 1px solid rgba(142, 78, 89, 0.2);
    }
    .btn-pastel-rose:hover { filter: brightness(0.97); }

    .btn-pastel-orchid {
      background: var(--p-orchid-petal);
      color: #FFFFFF;
    }
    .btn-pastel-orchid:hover { filter: brightness(0.95); }

    .btn-sm {
      padding: 7px 14px;
      font-size: 16px;
      min-height: 36px;
      border-radius: 12px;
    }

    /* Поля ввода */
    .field-label {
      display: block;
      font-size: 15px;
      font-weight: 600;
      color: var(--ink-muted);
      margin-bottom: 6px;
    }

    .input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 10px 14px;
      font-size: 18px;
      font-weight: 500;
      color: var(--ink-main);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(198, 216, 240, 0.55);
    }

    .input::placeholder {
      color: var(--ink-faint);
      font-style: italic;
    }

    textarea.input { resize: vertical; min-height: 92px; }

    /* Табы / чипы */
    .pills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill-tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      font-size: 16px;
      font-weight: 600;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--ink-muted);
    }

    .pill-tab:hover { background: var(--bg-hover); color: var(--ink-main); }

    .pill-tab.active {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(125, 148, 181, 0.24);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 11px;
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    /* Прогресс-бар */
    .progress-track {
      width: 100%;
      height: 7px;
      border-radius: 99px;
      background: rgba(125, 148, 181, 0.16);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    /* Переключатель (toggle) */
    .toggle {
      width: 46px;
      height: 26px;
      border-radius: 99px;
      background: rgba(125, 148, 181, 0.32);
      position: relative;
      flex-shrink: 0;
      transition: background 0.25s ease;
    }

    .toggle.on { background: var(--accent); }
    .toggle.on-orchid { background: #9C89B3; }
    .toggle.on-rose { background: #C88C96; }

    .toggle-knob {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #FFFFFF;
      position: absolute;
      top: 3px;
      left: 3px;
      box-shadow: 0 2px 5px rgba(38, 48, 64, 0.2);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .toggle.on .toggle-knob,
    .toggle.on-orchid .toggle-knob,
    .toggle.on-rose .toggle-knob {
      transform: translateX(20px);
    }

    /* Чекбокс задачи */
    .task-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 1.8px solid var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #FFFFFF;
      margin-top: 2px;
    }

    .task-checkbox.checked {
      background: var(--p-gossamer-green);
      border-color: var(--p-gossamer-green-ink);
      color: var(--ink-main);
    }

    /* Адаптивные сетки */
    .stack { display: flex; flex-direction: column; gap: 22px; }
    .stack-sm { display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

    .grid-2 { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .grid-widgets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .grid-split { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }

    @media (min-width: 640px) {
      .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 900px) {
      .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .grid-widgets { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .grid-split { grid-template-columns: 7fr 5fr; }
      .grid-split.reverse { grid-template-columns: 5fr 7fr; }
    }

    /* ==========================================================================
       5. SPECIFIC MODULE STYLES (CALENDAR, HABITS, MOVIES, BOOKS, NOTES, CYCLE)
       ========================================================================== */
    /* Звёзды 1–10 */
    .star-bar {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex-wrap: wrap;
    }

    .star-btn {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: rgba(125, 148, 181, 0.34);
      padding: 0;
    }

    .star-btn:hover { transform: scale(1.16); color: #D4B956; }
    .star-btn.filled { color: #D4B956; }
    .star-btn.filled svg { fill: var(--p-pastel-yellow); stroke: #B99B3B; }

    /* Карточка цитаты в книгах */
    .quote-card {
      position: relative;
      background: var(--p-cappucino-foam);
      border: 1px solid rgba(197, 183, 209, 0.55);
      border-left: 3.5px solid var(--p-orchid-petal);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .quote-text {
      font-style: italic;
      font-size: 19px;
      line-height: 1.5;
      color: var(--ink-main);
    }

    .quote-mark {
      font-size: 26px;
      line-height: 0.7;
      color: var(--p-orchid-petal-ink);
      opacity: 0.6;
      margin-right: 4px;
    }

    /* Календарная сетка */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .cal-weekday {
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      padding-bottom: 6px;
    }

    .cal-cell {
      min-height: 58px;
      padding: 6px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--bg-card-solid);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      text-align: left;
    }

    @media (min-width: 640px) {
      .cal-cell { min-height: 76px; padding: 8px; }
    }

    .cal-cell.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(125, 148, 181, 0.35);
    }

    .cal-cell.cycle-logged {
      background: var(--p-marys-rose);
      border-color: #DCA8B0;
    }

    .cal-cell.cycle-predicted {
      background: rgba(247, 214, 218, 0.45);
      border: 1.5px dashed #C78C96;
    }

    .cal-cell.cycle-ovulation {
      background: rgba(197, 183, 209, 0.45);
      border-color: #A591B8;
    }

    .cal-day-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
    }

    .cal-day-num.today {
      background: var(--accent);
      color: #FFFFFF;
    }

    /* Таблица привычек */
    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius-md);
    }

    .habits-table {
      width: 100%;
      min-width: 640px;
      border-collapse: collapse;
    }

    .habits-table th, .habits-table td {
      padding: 13px 10px;
      border-bottom: 1px solid var(--border);
    }

    .habits-table tr:last-child td { border-bottom: none; }

    .habit-check-btn {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      border: 1.5px solid var(--border-strong);
      background: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .habit-check-btn.done {
      background: var(--p-gossamer-green);
      border-color: #7AA688;
      color: var(--ink-main);
      box-shadow: 0 3px 8px rgba(181, 211, 190, 0.55);
    }

    /* Сетка заметок (masonry) */
    .notes-masonry {
      column-count: 1;
      column-gap: 16px;
    }
    @media (min-width: 640px) { .notes-masonry { column-count: 2; } }
    @media (min-width: 1120px) { .notes-masonry { column-count: 3; } }

    .note-card {
      break-inside: avoid;
      margin-bottom: 16px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(38, 48, 64, 0.1);
      padding: 20px;
      box-shadow: var(--shadow-soft);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .note-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .note-card.dark-surface {
      color: #FFFFFF;
    }
    .note-card.dark-surface h4,
    .note-card.dark-surface p,
    .note-card.dark-surface .note-body {
      color: #FFFFFF;
    }
    .note-card.dark-surface .note-meta {
      color: rgba(255, 255, 255, 0.85);
      border-top-color: rgba(255, 255, 255, 0.25);
    }

    /* Палитра из 9 оттенков Pantone */
    .pantone-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .pantone-option input { display: none; }

    .pantone-tile {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 9px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: #FFFFFF;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .pantone-option input:checked + .pantone-tile {
      border-color: var(--ink-main);
      box-shadow: 0 0 0 2px rgba(198, 216, 240, 0.65);
    }

    .pantone-swatch {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 1px solid rgba(38, 48, 64, 0.12);
      flex-shrink: 0;
    }

    .pantone-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.1;
      color: var(--ink-main);
    }

    /* Мини-календарь цикла */
    .cycle-day-btn {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
    }

    .cycle-day-btn.selected {
      border-color: var(--ink-main);
      box-shadow: 0 0 0 2px rgba(125, 148, 181, 0.3);
    }
    .cycle-day-btn.logged { background: var(--p-marys-rose); border-color: #CE959E; }
    .cycle-day-btn.predicted { background: rgba(247, 214, 218, 0.48); border: 1.5px dashed #C78C96; }
    .cycle-day-btn.ovulation { background: rgba(197, 183, 209, 0.45); border-color: #A18DB5; }

    /* ==========================================================================
       6. MODALS, BOTTOM SHEET & TOASTS
       ========================================================================== */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(38, 48, 64, 0.34);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .overlay.hidden { display: none; }

    .modal-box {
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      background: #FCFDFE;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 26px;
      box-shadow: var(--shadow-modal);
      animation: fadeLift 0.22s ease-out;
    }

    .sheet-box {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #FCFDFE;
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      border-top: 1px solid var(--border);
      padding: 16px 20px calc(26px + env(safe-area-inset-bottom, 0px));
      box-shadow: var(--shadow-modal);
      animation: fadeLift 0.22s ease-out;
    }

    .sheet-handle {
      width: 44px;
      height: 4px;
      border-radius: 99px;
      background: var(--border-strong);
      margin: 0 auto 14px;
    }

    .toast-stack {
      position: fixed;
      right: 16px;
      bottom: 84px;
      z-index: 80;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: calc(100vw - 32px);
      pointer-events: none;
    }

    @media (min-width: 1024px) {
      .toast-stack { bottom: 24px; right: 24px; }
    }

    .toast {
      pointer-events: auto;
      background: #FFFFFF;
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      padding: 12px 18px;
      box-shadow: var(--shadow-hover);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 600;
      animation: fadeLift 0.22s ease-out;
    }

    /* Утилиты */
    .muted { color: var(--ink-muted); }
    .faint { color: var(--ink-faint); }
    .italic { font-style: italic; }
    .text-sm { font-size: 15px; }
    .text-xs { font-size: 14px; }
    .line-through { text-decoration: line-through; opacity: 0.62; }
    .empty-box {
      text-align: center;
      padding: 42px 20px;
      background: var(--bg-card);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-md);
    }
    .divider {
      height: 1px;
      background: var(--border);
      margin: 14px 0;
    }
  </style>
</head>

    function pad2(n) { return String(n).padStart(2, '0'); }
    function toDateStr(d = new Date()) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
    function parseDateStr(str) { const [y, m, d] = str.split('-').map(Number); return new Date(y, m - 1, d); }
    function addDays(dateStr, days) { const d = parseDateStr(dateStr); d.setDate(d.getDate() + days); return toDateStr(d); }
    function diffDays(aStr, bStr) {
      const a = parseDateStr(aStr), b = parseDateStr(bStr);
      return Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000);
    }
    function getMondayOfWeek(dateStr) {
      const d = parseDateStr(dateStr);
      const day = d.getDay();
      d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
      return toDateStr(d);
    }
    function formatHumanDate(dateStr, withWeekday = false) {
      const d = parseDateStr(dateStr);
      const base = `${d.getDate()} ${MONTHS_GEN_RU[d.getMonth()]}`;
      return withWeekday ? `${WEEKDAYS_FULL_RU[d.getDay()]}, ${base}` : base;
    }
    function formatShortDate(dateStr) {
      if (!dateStr) return '';
      const today = toDateStr();
      if (dateStr === today) return 'Сегодня';
      if (dateStr === addDays(today, 1)) return 'Завтра';
      if (dateStr === addDays(today, -1)) return 'Вчера';
      const d = parseDateStr(dateStr);
      return `${d.getDate()} ${MONTHS_GEN_RU[d.getMonth()].slice(0, 3)}`;
    }
    function formatCurrency(num) {
      const sign = num < 0 ? '−' : '';
      return sign + Math.round(Math.abs(num)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽';
    }
    function pluralDays(n) {
      const abs = Math.abs(n) % 100, n1 = abs % 10;
      if (abs > 10 && abs < 20) return `${n} дней`;
      if (n1 > 1 && n1 < 5) return `${n} дня`;
      if (n1 === 1) return `${n} день`;
      return `${n} дней`;
    }

    function showToast(message, dotColor = 'var(--p-endless-sky)') {
      const stack = document.getElementById('toast-stack');
      if (!stack) return;
      const el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML = `<span class="dot" style="background:${dotColor}; width:10px; height:10px;"></span><span>${esc(message)}</span>`;
      stack.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(6px)';
        el.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 2600);
    }

    function getCycleEpisodes() {
      const days = [...new Set(state.cycle.periodDays)].sort();
      if (!days.length) return [];
      const eps = [];
      let cur = { start: days[0], end: days[0], days: [days[0]] };
      for (let i = 1; i < days.length; i++) {
        if (diffDays(cur.end, days[i]) <= 2) {
          cur.end = days[i];
          cur.days.push(days[i]);
        } else {
          cur.length = diffDays(cur.start, cur.end) + 1;
          eps.push(cur);
          cur = { start: days[i], end: days[i], days: [days[i]] };
        }
      }
      cur.length = diffDays(cur.start, cur.end) + 1;
      eps.push(cur);
      return eps;
    }

    function getCyclePhaseInfo(day, cycleLen, periodLen, isLogged = false) {
      const ovDay = Math.max(periodLen + 2, cycleLen - 14);

        return {

      if (day >= ovDay - 2 && day <= ovDay + 1) {
        return {
          name: 'Овуляция', short: 'Овуляция',
          bg: 'var(--p-orchid-petal)', ink: '#FFFFFF', ring: '#A994BC',
          desc: 'Пик ясности, притягательности и внутренней энергии. Прекрасное время для общения и смелых планов.'
        };
      }
      if (day > periodLen && day < ovDay - 2) {
        return {
          name: 'Фолликулярная фаза', short: 'Фолликулярная',
          bg: 'var(--p-delicate-blue)', ink: '#3B5270', ring: '#7D94B5',
          desc: 'Силы и любопытство бережно растут. Легко начинать новые проекты, читать, учиться и мечтать.'
        };

      return {

        bg: 'var(--p-hushed-violet)', ink: '#573F4B', ring: '#B79EA8',

    function getCycleOverview(refDate = toDateStr()) {
      const episodes = getCycleEpisodes();
      const cycleLen = Number(state.cycle.cycleLength) || 28;
      const periodLen = Number(state.cycle.periodLength) || 5;
      const past = episodes.filter(e => e.start <= refDate);
      if (!past.length) return { hasData: false, cycleLen, periodLen, episodes };
      const last = past[past.length - 1];
      const dayOfCycle = diffDays(last.start, refDate) + 1;
      const isLoggedToday = state.cycle.periodDays.includes(refDate);
      const nextPeriodStart = addDays(last.start, cycleLen);
      const daysUntilNext = diffDays(refDate, nextPeriodStart);
      const ovDay = Math.max(periodLen + 2, cycleLen - 14);
      const ovulationDate = addDays(last.start, ovDay - 1);
      const effDay = dayOfCycle <= cycleLen ? dayOfCycle : ((dayOfCycle - 1) % cycleLen) + 1;
      const phase = getCyclePhaseInfo(effDay, cycleLen, periodLen, isLoggedToday);

      return {
        hasData: true, cycleLen, periodLen, episodes, lastStart: last.start,
        dayOfCycle, isLate: dayOfCycle > cycleLen, lateDays: Math.max(0, dayOfCycle - cycleLen),
        nextPeriodStart, daysUntilNext, ovulationDate, phase, isLoggedToday
      };
    }

    function getCycleDateStatus(dateStr) {
      if (state.cycle.periodDays.includes(dateStr)) return { type: 'logged', label: 'Отмеченный день менструации' };
      const ov = getCycleOverview(toDateStr());
      if (!ov.hasData) return null;
      const diff = diffDays(ov.lastStart, dateStr);
      if (diff < 0) return null;
      const cycIdx = Math.floor(diff / ov.cycleLen);
      const dayIn = (diff % ov.cycleLen) + 1;
      const ovDay = Math.max(ov.periodLen + 2, ov.cycleLen - 14);
      const today = toDateStr();
      if (dayIn >= 1 && dayIn <= ov.periodLen && (cycIdx >= 1 || dateStr > today)) {
        return { type: 'predicted', label: 'Прогноз менструации', dayIn };
      }
      if (dayIn >= ovDay - 2 && dayIn <= ovDay + 1) {
        return { type: 'ovulation', label: 'Окно овуляции', dayIn };
      }
      return { type: 'normal', dayIn, phase: getCyclePhaseInfo(dayIn, ov.cycleLen, ov.periodLen, false) };
    }

    function getHabitStreak(habit) {
      const today = toDateStr();
      let cursor = habit.logs?.[today] ? today : addDays(today, -1);
      let streak = 0;
      while (habit.logs?.[cursor]) { streak++; cursor = addDays(cursor, -1); }
      return streak;
    }

    function getHabitWeekPct(habit, weekStart) {
      let done = 0;
      for (let i = 0; i < 7; i++) if (habit.logs?.[addDays(weekStart, i)]) done++;
      return Math.round((done / 7) * 100);
    }

    let activeManifestUrl = null;

    function drawAppIconToCanvas(canvas, styleId = 'powder') {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const pal = ICON_STYLES[styleId] || ICON_STYLES.powder;
      const w = canvas.width;
      const h = canvas.height;
      const s = w / 512;

      ctx.clearRect(0, 0, w, h);

      // 1. Диагональный пастельный фон
      const bg = ctx.createLinearGradient(0, 0, w, h);
      bg.addColorStop(0, pal.grad[0]);
      bg.addColorStop(0.55, pal.grad[1]);
      bg.addColorStop(1, pal.grad[2]);
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // 2. Воздушные акварельные блики
      const g1 = ctx.createRadialGradient(w * 0.22, h * 0.2, 0, w * 0.22, h * 0.2, w * 0.58);
      g1.addColorStop(0, pal.glowTop);
      g1.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, w, h);

      const g2 = ctx.createRadialGradient(w * 0.82, h * 0.84, 0, w * 0.82, h * 0.84, w * 0.56);
      g2.addColorStop(0, pal.glowBottom);
      g2.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g2;
      ctx.fillRect(0, 0, w, h);

      // 3. Тонкая журнальная рамка внутри иконки
      const pad = 34 * s;
      const rad = 76 * s;
      ctx.beginPath();
      ctx.moveTo(pad + rad, pad);
      ctx.lineTo(w - pad - rad, pad);
      ctx.quadraticCurveTo(w - pad, pad, w - pad, pad + rad);
      ctx.lineTo(w - pad, h - pad - rad);
      ctx.quadraticCurveTo(w - pad, h - pad, w - pad - rad, h - pad);
      ctx.lineTo(pad + rad, h - pad);
      ctx.quadraticCurveTo(pad, h - pad, pad, h - pad - rad);
      ctx.lineTo(pad, pad + rad);
      ctx.quadraticCurveTo(pad, pad, pad + rad, pad);
      ctx.closePath();
      ctx.strokeStyle = pal.frame;
      ctx.lineWidth = 3 * s;
      ctx.stroke();

      const cx = w / 2;
      const cy = h / 2;

      // 4. Нежное полупрозрачное кольцо ритма
      ctx.beginPath();
      ctx.arc(cx, cy, 168 * s, 0, Math.PI * 2);
      ctx.strokeStyle = pal.frame;
      ctx.lineWidth = 2.5 * s;
      ctx.stroke();

      // Акцентная дуга
      ctx.beginPath();
      ctx.arc(cx, cy, 168 * s, -Math.PI * 0.68, Math.PI * 0.22);
      ctx.strokeStyle = pal.ring;
      ctx.lineWidth = 5 * s;
      ctx.lineCap = 'round';
      ctx.stroke();

      // 5. Четырёхлучевая звёздочка в верхней правой точке дуги
      const starX = cx + Math.cos(-Math.PI * 0.24) * 168 * s;
      const starY = cy + Math.sin(-Math.PI * 0.24) * 168 * s;
      const sr = 20 * s;
      ctx.save();
      ctx.translate(starX, starY);
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const angle = (i * Math.PI) / 2;
        const nextAngle = angle + Math.PI / 4;
        const ox = Math.cos(angle) * sr;
        const oy = Math.sin(angle) * sr;
        const ix = Math.cos(nextAngle) * (sr * 0.28);
        const iy = Math.sin(nextAngle) * (sr * 0.28);
        if (i === 0) ctx.moveTo(ox, oy);
        else ctx.lineTo(ox, oy);
        ctx.lineTo(ix, iy);
      }
      ctx.closePath();
      ctx.fillStyle = pal.accent;
      ctx.fill();
      ctx.restore();

      // 6. Монограмма «МР» в журнальной антикве Cormorant Garamond
      ctx.fillStyle = pal.ink;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `600 ${Math.round(146 * s)}px "Cormorant Garamond", Georgia, serif`;
      ctx.fillText('МР', cx, cy + 6 * s);

      // Маленькая декоративная точка под монограммой
      ctx.beginPath();
      ctx.arc(cx, cy + 92 * s, 5.5 * s, 0, Math.PI * 2);
      ctx.fillStyle = pal.ring;
      ctx.fill();
    }

    function applyPwaIconAndManifest() {
      try {
        const iconStyle = state.settings.iconStyle || 'powder';
        const offscreen = document.createElement('canvas');
        offscreen.width = 512;
        offscreen.height = 512;
        drawAppIconToCanvas(offscreen, iconStyle);
        const pngUrl = offscreen.toDataURL('image/png');

        const fav = document.getElementById('app-favicon');
        const touch = document.getElementById('app-touch-icon');
        if (fav) {
          fav.type = 'image/png';
          fav.href = pngUrl;
        }
        if (touch) touch.href = pngUrl;

        const themeColorMap = {
          powder: '#C6D8F0',
          cream: '#F4F3E8',
          lavender: '#C5B7D1'
        };
        const barColor = state.settings.eveningMode
          ? '#DFD6EB'
          : (themeColorMap[state.settings.theme] || '#C6D8F0');

        const metaTheme = document.getElementById('app-theme-color');
        if (metaTheme) metaTheme.setAttribute('content', barColor);

        const isHttp = window.location.protocol === 'http:' || window.location.protocol === 'https:';
        const pageUrl = isHttp ? window.location.href.split('#')[0] : './';
        const scopeUrl = isHttp ? (pageUrl.substring(0, pageUrl.lastIndexOf('/') + 1) || window.location.origin + '/') : './';

        const manifestObj = {
          name: 'Мой ритм — Личный ежедневник',
          short_name: 'Мой ритм',
          description: 'Пастельный ежедневник для задач, книг, кино, заметок, цикла и финансов',
          start_url: pageUrl,
          scope: scopeUrl,
          display: 'standalone',
          orientation: 'portrait-primary',
          background_color: barColor,
          theme_color: barColor,
          icons: [
            {
              src: pngUrl,
              sizes: '512x512',
              type: 'image/png',
              purpose: 'any maskable'
            }
          ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        const manifestLink = document.getElementById('app-manifest');
        if (manifestLink) {
          if (activeManifestUrl) URL.revokeObjectURL(activeManifestUrl);
          activeManifestUrl = manifestUrl;
          manifestLink.href = manifestUrl;
        }
      } catch (e) {
        // Тихий fallback при ограничениях песочницы
      }
    }

      if (isModuleEnabled('movies')) {
        widgets.push(`
          <div class="card clickable" onclick="navigate('movies')" style="background: linear-gradient(145deg, #FFFFFF, rgba(210,193,200,0.34));">
            <div class="row-between" style="margin-bottom: 6px;">
              <span class="text-sm muted">${eveningMovie?.status === 'planned' ? 'Фильм на вечер' : 'Моё кино'}</span>
              <span class="dot" style="background: var(--p-hushed-violet-ink);"></span>
            </div>
            ${eveningMovie ? `
              <div style="font-size: 21px; font-weight: 700; line-height: 1.2;">${esc(eveningMovie.title)}</div>
              <div class="text-sm muted" style="margin-top: 4px;">${esc(eveningMovie.genre)}${eveningMovie.year ? ` · ${esc(eveningMovie.year)}` : ''}</div>
            ` : `<div class="muted">Добавить фильм</div>`}
          </div>
        `);
      }

      const domainsToShow = ev ? ['personal', 'interests'] : ['work', 'personal', 'interests'];

      return `
        <div class="view-enter stack">
          <!-- Приветствие и Вечерний режим -->
          <div class="page-header" style="margin-bottom: 4px;">
            <div>
              <div class="eyebrow">${formatHumanDate(today, true)}</div>
              <h1 class="page-title">${getGreeting()}</h1>
            </div>

            <div class="card row" style="padding: 10px 16px; border-radius: 18px;">
              <div>
                <div style="font-size: 17px; font-weight: 700; line-height: 1.1;">Вечерний режим</div>
                <div class="text-xs muted">${ev ? 'Работа скрыта · уютный лавандовый тон' : 'Скрыть рабочие дела на вечер'}</div>
              </div>
              <button onclick="toggleEveningMode()" class="toggle ${ev ? 'on-orchid' : ''}" aria-label="Переключить вечерний режим">
                <span class="toggle-knob"></span>
              </button>
            </div>
          </div>

          <!-- Виджеты сводки дня -->
          ${widgets.length ? `<div class="grid-widgets">${widgets.join('')}</div>` : ''}

          <!-- Задачи на сегодня по сферам -->
          ${isModuleEnabled('tasks') ? `
            <section>
              <div class="row-between" style="margin-bottom: 14px;">
                <h2 class="section-title">План на сегодня</h2>
                <button onclick="openTaskModal()" class="btn btn-secondary btn-sm">
                  ${iconSvg('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', 16)}
                  <span>Новая задача</span>
                </button>
              </div>

              <div class="${ev ? 'grid-2' : 'grid-3'}">
                ${domainsToShow.map(domId => {
                  const dom = DOMAINS[domId];
                  const items = todayTasksAll
                    .filter(t => t.domain === domId)
                    .sort((a, b) => Number(a.completed) - Number(b.completed) || (b.priority === 'high') - (a.priority === 'high'));
                  return `
                    <div class="card" style="display:flex; flex-direction:column;">
                      <div class="card-header">
                        <div class="row" style="gap: 8px;">
                          <span class="dot" style="background:${dom.accent}; width:10px; height:10px;"></span>
                          <h3 style="font-size: 22px;">${dom.label}</h3>
                        </div>
                        <span class="badge" style="background:${dom.softBg}; color:${dom.ink};">${items.filter(x => x.completed).length}/${items.length}</span>
                      </div>

                      <div class="stack-sm" style="flex:1;">
                        ${items.length ? items.map(renderCompactTask).join('') : `<p class="muted italic text-sm" style="text-align:center; padding: 14px 0;">На сегодня тихо и свободно</p>`}
                      </div>

                      <form onsubmit="handleQuickTask(event, '${domId}', '${today}')" style="margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); display:flex; gap:8px;">
                        <input type="text" name="title" placeholder="+ Добавить в «${dom.label}»..." style="flex:1; background:transparent; border:none; outline:none; font-size:17px;" />
                        <button type="submit" class="icon-btn sm ghost" title="Добавить">
                          ${iconSvg('<polyline points="9 18 15 12 9 6"/>', 17)}
                        </button>
                      </form>
                    </div>
                  `;
                }).join('')}
              </div>
            </section>
          ` : ''}

          <!-- Быстрая отметка привычек -->
          ${isModuleEnabled('habits') ? `
            <section class="card">
              <div class="row-between" style="margin-bottom: 14px;">
                <div>
                  <h2 class="section-title">Привычки дня</h2>
                  <p class="text-sm muted">Отмечайте в одно касание</p>
                </div>
                <button onclick="navigate('habits')" class="btn btn-secondary btn-sm">Вся неделя →</button>
              </div>
              ${visHabits.length ? `
                <div class="grid-2">
                  ${visHabits.map(h => {
                    const checked = Boolean(h.logs?.[today]);
                    const streak = getHabitStreak(h);
                    return `
                      <button onclick="toggleHabitDay('${h.id}', '${today}')" style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-radius:14px; border:1px solid ${checked ? '#7AA688' : 'var(--border)'}; background:${checked ? 'rgba(181,211,190,0.45)' : '#FFFFFF'}; text-align:left;">
                        <div class="row" style="gap:12px;">
                          <span class="habit-check-btn ${checked ? 'done' : ''}" style="width:28px;height:28px;border-radius:9px;">
                            ${checked ? iconSvg('<polyline points="20 6 9 17 4 12"/>', 15) : ''}
                          </span>
                          <div>
                            <div style="font-size:18px; font-weight:600;" class="${checked ? 'line-through' : ''}">${esc(h.name)}</div>
                            <div class="text-xs muted">${streak > 0 ? `Серия: ${pluralDays(streak)}` : 'Начать серию сегодня'}</div>
                          </div>
                        </div>
                      </button>
                    `;
                  }).join('')}
                </div>
              ` : `<p class="muted">Добавьте первую привычку в разделе «Трекеры».</p>`}
            </section>
          ` : ''}
        </div>
      `;
    }

    function renderCompactTask(task) {
      const dom = DOMAINS[task.domain] || DOMAINS.personal;
      return `
        <div style="display:flex; align-items:flex-start; gap:10px;">
          <button onclick="toggleTaskDone('${task.id}')" class="task-checkbox ${task.completed ? 'checked' : ''}" style="${task.completed ? '' : `border-color:${dom.accent};`}" aria-label="Выполнить">
            ${task.completed ? iconSvg('<polyline points="20 6 9 17 4 12"/>', 13) : ''}
          </button>
          <div style="flex:1; cursor:pointer;" onclick="openTaskModal('${task.id}')">
            <div style="font-size:18px; line-height:1.3;" class="${task.completed ? 'line-through' : ''}">
              ${task.priority === 'high' && !task.completed ? `<span class="dot" style="background:var(--p-pastel-yellow); border:1px solid #B99B3B; margin-right:6px;" title="Важное"></span>` : ''}
              ${esc(task.title)}
            </div>
            <div class="row" style="gap:6px; margin-top:4px; flex-wrap:wrap;">
              ${task.time ? `<span class="text-xs muted">${esc(task.time)}</span>` : ''}
              ${task.subcategory ? `<span class="badge" style="background:var(--p-cappucino-foam); color:var(--ink-muted); font-size:13px; padding:1px 8px;">${esc(task.subcategory)}</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function handleQuickTask(e, domain, dateStr) {
      e.preventDefault();
      const inp = e.target.querySelector('input[name="title"]');
      const title = inp.value.trim();
      if (!title) return;
      state.tasks.unshift({
        id: uid('t'), title, domain,
        subcategory: DOMAINS[domain].subcategories[0],
        date: dateStr, time: '', priority: 'normal', note: '', completed: false
      });
      saveState();
      renderView();
      showToast('Задача добавлена', DOMAINS[domain].accent);
    }

    /* ==========================================================================
       8. РАЗДЕЛ 2: ЗАДАЧИ
       ========================================================================== */
    function renderTasksView() {
      const today = toDateStr();
      const ev = state.settings.eveningMode;
      const movable = state.tasks.filter(t => !t.completed && t.date <= today && (!ev || t.domain !== 'work')).length;
      const list = getFilteredTasks();

      const spaces = [
        { id: 'all', label: 'Все сферы', color: 'var(--p-endless-sky)' },
        { id: 'work', label: 'Работа', color: DOMAINS.work.accent },
        { id: 'personal', label: 'Личное', color: DOMAINS.personal.accent },
        { id: 'interests', label: 'Интересы', color: DOMAINS.interests.accent }
      ];

      return `
        <div class="view-enter stack">
          <div class="page-header">
            <div>
              <div class="eyebrow">Три сферы жизни</div>
              <h1 class="page-title">Задачи</h1>
            </div>
            <div class="row" style="flex-wrap:wrap;">
              ${movable > 0 ? `
                <button onclick="postponeTasksToTomorrow()" class="btn btn-secondary btn-sm">
                  ${iconSvg('<polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/>', 16)}
                  <span>Перенести на завтра (${movable})</span>
                </button>
              ` : ''}
              <button onclick="openTaskModal()" class="btn btn-primary btn-sm">
                ${iconSvg('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', 16)}
                <span>Добавить задачу</span>
              </button>
            </div>
          </div>

          ${ev ? `
            <div class="card row-between" style="padding:12px 18px; background: rgba(197,183,209,0.28);">
              <span class="text-sm">Включён вечерний режим — рабочие дела скрыты в общем списке.</span>
              <button onclick="toggleEveningMode()" class="btn btn-secondary btn-sm">Выключить</button>
            </div>
          ` : ''}

          <div class="row-between">
            <div class="pills-row">
              ${spaces.map(sp => `
                <button onclick="ui.taskDomain='${sp.id}'; renderView();" class="pill-tab ${ui.taskDomain === sp.id ? 'active' : ''}">
                  ${sp.id !== 'all' ? `<span class="dot" style="background:${ui.taskDomain === sp.id ? '#FFFFFF' : sp.color};"></span>` : ''}
                  <span>${sp.label}</span>
                </button>
              `).join('')}
            </div>

            <div class="pills-row">
              ${[['active', 'Активные'], ['completed', 'Выполненные'], ['all', 'Все']].map(([st, lbl]) => `
                <button onclick="ui.taskStatus='${st}'; renderView();" class="pill-tab ${ui.taskStatus === st ? 'active' : ''}" style="padding:6px 13px; font-size:15px;">${lbl}</button>
              `).join('')}
            </div>
          </div>

          <input type="text" class="input" value="${esc(ui.taskSearch)}" oninput="ui.taskSearch=this.value; updateTasksListDOM();" placeholder="Поиск по задачам, подкатегориям и заметкам..." />

          <div id="tasks-list-dom" class="stack-sm">
            ${renderTasksListHTML(list, today)}
          </div>
        </div>
      `;
    }

    function getFilteredTasks() {
      const ev = state.settings.eveningMode;
      let list = [...state.tasks];
      if (ev && ui.taskDomain === 'all') list = list.filter(t => t.domain !== 'work');
      else if (ui.taskDomain !== 'all') list = list.filter(t => t.domain === ui.taskDomain);
      if (ui.taskStatus === 'active') list = list.filter(t => !t.completed);
      if (ui.taskStatus === 'completed') list = list.filter(t => t.completed);
      if (ui.taskSearch.trim()) {
        const q = ui.taskSearch.trim().toLowerCase();
        list = list.filter(t => t.title.toLowerCase().includes(q) || (t.subcategory || '').toLowerCase().includes(q) || (t.note || '').toLowerCase().includes(q));
      }
      return list.sort((a, b) => Number(a.completed) - Number(b.completed) || a.date.localeCompare(b.date) || (b.priority === 'high') - (a.priority === 'high'));
    }

    function updateTasksListDOM() {
      const box = document.getElementById('tasks-list-dom');
      if (box) box.innerHTML = renderTasksListHTML(getFilteredTasks(), toDateStr());
    }

    function renderTasksListHTML(list, today) {
      if (!list.length) {
        return `<div class="empty-box"><h3 style="font-size:24px;">Здесь пока свободно</h3><p class="muted" style="margin-top:6px;">Задач по выбранному фильтру нет.</p></div>`;
      }
      return list.map(t => {
        const dom = DOMAINS[t.domain] || DOMAINS.personal;
        const overdue = !t.completed && t.date < today;
        return `
          <div class="card" style="padding: 16px 18px; display:flex; align-items:flex-start; gap:14px;">
            <button onclick="toggleTaskDone('${t.id}')" class="task-checkbox ${t.completed ? 'checked' : ''}" style="${t.completed ? '' : `border-color:${dom.accent};`}">
              ${t.completed ? iconSvg('<polyline points="20 6 9 17 4 12"/>', 13) : ''}
            </button>
            <div style="flex:1; min-width:0;">
              <div class="row" style="flex-wrap:wrap; gap:8px;">
                <span style="font-size:19px; font-weight:600;" class="${t.completed ? 'line-through' : ''}">${esc(t.title)}</span>
                ${t.priority === 'high' ? `<span class="badge" style="background:var(--p-pastel-yellow); color:var(--p-pastel-yellow-ink);">Важно</span>` : ''}
              </div>
              ${t.note ? `<p class="text-sm muted" style="margin-top:4px;">${esc(t.note)}</p>` : ''}
              <div class="row" style="flex-wrap:wrap; gap:8px; margin-top:8px;">
                <span class="badge" style="background:${dom.softBg}; color:${dom.ink};">${dom.label}</span>
                ${t.subcategory ? `<span class="badge" style="background:var(--p-cappucino-foam); color:var(--ink-muted);">${esc(t.subcategory)}</span>` : ''}
                <span class="text-sm ${overdue ? '' : 'muted'}" style="${overdue ? 'color:var(--p-marys-rose-ink); font-weight:700;' : ''}">
                  ${overdue ? 'Просрочено · ' : ''}${formatShortDate(t.date)}${t.time ? `, ${esc(t.time)}` : ''}
                </span>
              </div>
            </div>
            <div class="row" style="gap:4px;">
              <button onclick="openTaskModal('${t.id}')" class="icon-btn sm ghost" title="Редактировать">${iconSvg('<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>', 16)}</button>
              <button onclick="deleteTask('${t.id}')" class="icon-btn sm ghost danger" title="Удалить">${iconSvg('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>', 16)}</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleTaskDone(id) {
      const t = state.tasks.find(x => x.id === id);
      if (!t) return;
      t.completed = !t.completed;
      saveState();
      renderView();
    }

    function postponeTasksToTomorrow() {
      const today = toDateStr(), tomorrow = addDays(today, 1), ev = state.settings.eveningMode;
      let count = 0;
      state.tasks.forEach(t => {
        if (!t.completed && t.date <= today && (!ev || t.domain !== 'work')) { t.date = tomorrow; count++; }
      });
      if (count) { saveState(); renderView(); showToast(`Перенесено на завтра: ${count}`); }
    }

    async function deleteTask(id) {
      if (!(await askConfirm('Удалить задачу?', 'Эта задача исчезнет из вашего списка.'))) return;
      state.tasks = state.tasks.filter(t => t.id !== id);
      saveState();
      renderView();
      showToast('Задача удалена');
    }

    function openTaskModal(taskId = null, defaultDate = null) {
      const ex = taskId ? state.tasks.find(t => t.id === taskId) : null;
      const dom = ex ? ex.domain : (ui.taskDomain !== 'all' ? ui.taskDomain : 'personal');
      const subcats = DOMAINS[dom].subcategories;

      openModal(`
        <div class="row-between" style="margin-bottom:18px;">
          <h3 style="font-size:28px;">${ex ? 'Редактировать задачу' : 'Новая задача'}</h3>
          <button onclick="closeModal()" class="icon-btn sm ghost">${iconSvg('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>', 19)}</button>
        </div>
        <form onsubmit="saveTaskForm(event, '${ex ? ex.id : ''}')" class="stack-sm">
          <div>
            <label class="field-label">Название</label>
            <input type="text" name="title" class="input" required value="${esc(ex?.title || '')}" placeholder="Что хочется успеть?" autofocus />
          </div>
          <div class="grid-2">
            <div>
              <label class="field-label">Сфера</label>
              <select name="domain" class="input" onchange="updateSubcatSelect(this.value)">
                <option value="work" ${dom === 'work' ? 'selected' : ''}>Работа</option>
                <option value="personal" ${dom === 'personal' ? 'selected' : ''}>Личное</option>
                <option value="interests" ${dom === 'interests' ? 'selected' : ''}>Интересы</option>
              </select>
            </div>
            <div>
              <label class="field-label">Подкатегория</label>
              <select name="subcategory" id="modal-subcat" class="input">
                ${subcats.map(s => `<option value="${esc(s)}" ${ex?.subcategory === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="grid-3">
            <div>
              <label class="field-label">Дата</label>
              <input type="date" name="date" class="input" required value="${ex ? ex.date : (defaultDate || toDateStr())}" />
            </div>
            <div>
              <label class="field-label">Время</label>
              <input type="time" name="time" class="input" value="${esc(ex?.time || '')}" />
            </div>
            <div>
              <label class="field-label">Приоритет</label>
              <select name="priority" class="input">
                <option value="normal" ${(ex?.priority || 'normal') === 'normal' ? 'selected' : ''}>Обычный</option>
                <option value="high" ${ex?.priority === 'high' ? 'selected' : ''}>Важный</option>
              </select>
            </div>
          </div>
          <div>
            <label class="field-label">Заметка</label>
            <textarea name="note" class="input" rows="3" placeholder="Дополнительные детали...">${esc(ex?.note || '')}</textarea>
          </div>
          <div class="row" style="justify-content:flex-end; margin-top:8px;">
            <button type="button" onclick="closeModal()" class="btn btn-secondary btn-sm">Отмена</button>
            <button type="submit" class="btn btn-primary btn-sm">${ex ? 'Сохранить' : 'Создать'}</button>
          </div>
        </form>
      `);
    }

    function updateSubcatSelect(domId) {
      const sel = document.getElementById('modal-subcat');
      if (sel) sel.innerHTML = DOMAINS[domId].subcategories.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
    }

    function saveTaskForm(e, existingId) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = {
        title: fd.get('title').trim(),
        domain: fd.get('domain'),
        subcategory: fd.get('subcategory'),
        date: fd.get('date'),
        time: fd.get('time') || '',
        priority: fd.get('priority'),
        note: fd.get('note').trim()
      };
      if (!data.title) return;
      if (existingId) {
        const idx = state.tasks.findIndex(t => t.id === existingId);
        if (idx !== -1) state.tasks[idx] = { ...state.tasks[idx], ...data };
        showToast('Задача обновлена');
      } else {
        state.tasks.unshift({ id: uid('t'), ...data, completed: false });
        showToast('Задача создана');
      }
      saveState(); closeModal(); renderView();
    }

    /* ==========================================================================
       9. РАЗДЕЛ 3: КАЛЕНДАРЬ
       ========================================================================== */
    function renderCalendarView() {
      const today = toDateStr();
      const y = ui.calYear, m = ui.calMonth;
      const firstDay = new Date(y, m, 1);
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const offset = (firstDay.getDay() + 6) % 7;
      const showCycle = isModuleEnabled('cycle') && state.settings.showCycleOnCalendar;
      const ev = state.settings.eveningMode;

      const tasksByDate = {};
      state.tasks.forEach(t => {
        if (ev && t.domain === 'work') return;
        (tasksByDate[t.date] = tasksByDate[t.date] || []).push(t);
      });

      const cells = [];
      for (let i = 0; i < offset; i++) cells.push('<div></div>');
      for (let d = 1; d <= daysInMonth; d++) {
        const dStr = `${y}-${pad2(m + 1)}-${pad2(d)}`;
        const dayTasks = tasksByDate[dStr] || [];
        const doms = [...new Set(dayTasks.map(t => t.domain))];
        const cyc = showCycle ? getCycleDateStatus(dStr) : null;
        const cCls = cyc?.type === 'logged' ? 'cycle-logged' : cyc?.type === 'predicted' ? 'cycle-predicted' : cyc?.type === 'ovulation' ? 'cycle-ovulation' : '';
        cells.push(`
          <button onclick="ui.calSelectedDate='${dStr}'; renderView();" class="cal-cell ${cCls} ${dStr === ui.calSelectedDate ? 'selected' : ''}">
            <span class="cal-day-num ${dStr === today ? 'today' : ''}">${d}</span>
            <div class="row" style="gap:4px; flex-wrap:wrap;">
              ${doms.map(id => `<span class="dot" style="width:7px;height:7px;background:${DOMAINS[id].accent};"></span>`).join('')}
            </div>
          </button>
        `);
      }

      const sel = ui.calSelectedDate;
      const selTasks = (tasksByDate[sel] || []).sort((a, b) => Number(a.completed) - Number(b.completed));
      const selCyc = isModuleEnabled('cycle') ? getCycleDateStatus(sel) : null;

      return `
        <div class="view-enter stack">
          <div class="page-header">
            <div>
              <div class="eyebrow">Планирование месяца</div>
              <h1 class="page-title">${MONTHS_RU[m]} ${y}</h1>
            </div>
            <div class="row" style="flex-wrap:wrap;">
              ${isModuleEnabled('cycle') ? `
                <div class="card row" style="padding: 8px 14px; border-radius: 14px;">
                  <span class="text-sm">Цикл в календаре</span>
                  <button onclick="toggleCycleOnCalendar()" class="toggle ${showCycle ? 'on-rose' : ''}" style="transform:scale(0.85);">
                    <span class="toggle-knob"></span>
                  </button>
                </div>
              ` : ''}
              <div class="card row" style="padding: 6px; border-radius: 14px; gap: 4px;">
                <button onclick="shiftCalMonth(-1)" class="icon-btn sm ghost">${iconSvg('<polyline points="15 18 9 12 15 6"/>', 17)}</button>
                <button onclick="jumpCalToday()" class="btn btn-secondary btn-sm" style="border:none;">Сегодня</button>
                <button onclick="shiftCalMonth(1)" class="icon-btn sm ghost">${iconSvg('<polyline points="9 18 15 12 9 6"/>', 17)}</button>
              </div>
            </div>
          </div>

          <div class="grid-split">
            <div class="card">
              <div class="cal-grid" style="margin-bottom: 8px;">
                ${WEEKDAYS_SHORT_MON.map(w => `<div class="cal-weekday">${w}</div>`).join('')}
              </div>
              <div class="cal-grid">${cells.join('')}</div>
              <div class="row" style="flex-wrap:wrap; gap:14px; margin-top:16px; padding-top:14px; border-top:1px solid var(--border); font-size:14px;">
                ${!ev ? `<span class="row" style="gap:6px;"><span class="dot" style="background:${DOMAINS.work.accent};"></span>Работа</span>` : ''}
                <span class="row" style="gap:6px;"><span class="dot" style="background:${DOMAINS.personal.accent};"></span>Личное</span>
                <span class="row" style="gap:6px;"><span class="dot" style="background:${DOMAINS.interests.accent};"></span>Интересы</span>
                ${showCycle ? `
                  <span class="row" style="gap:6px;"><span class="dot" style="background:var(--p-marys-rose);border:1px solid #CE959E;"></span>Менструация</span>
                  <span class="row" style="gap:6px;"><span class="dot" style="background:var(--p-orchid-petal);"></span>Овуляция</span>
                ` : ''}
              </div>
            </div>

            <div class="card stack-sm">
              <div style="padding-bottom:12px; border-bottom:1px solid var(--border);">
                <div class="eyebrow">Выбранная дата</div>
                <h3 style="font-size:26px;">${formatHumanDate(sel, true)}</h3>
                ${selCyc ? `
                  <div style="margin-top:8px;">
                    <span class="badge" style="background:${selCyc.type === 'ovulation' ? 'var(--p-orchid-petal)' : selCyc.type === 'normal' ? selCyc.phase.bg : 'var(--p-marys-rose)'}; color:${selCyc.type === 'ovulation' ? '#FFFFFF' : selCyc.type === 'normal' ? selCyc.phase.ink : 'var(--p-marys-rose-ink)'};">
                      ${selCyc.label || `День ${selCyc.dayIn} · ${selCyc.phase.short}`}
                    </span>
                  </div>
                ` : ''}
              </div>

              <div class="stack-sm">
                ${selTasks.length ? selTasks.map(renderCompactTask).join('') : `<p class="muted italic text-sm" style="text-align:center; padding: 12px 0;">На этот день задач пока нет</p>`}
              </div>

              <form onsubmit="handleCalAddTask(event, '${sel}')" class="stack-sm" style="padding-top:12px; border-top:1px solid var(--border);">
                <div style="font-size:16px; font-weight:700;">Добавить задачу на ${formatShortDate(sel).toLowerCase()}</div>
                <input type="text" name="title" class="input" required placeholder="Название задачи..." />
                <div class="row">
                  <select name="domain" class="input" style="flex:1;">
                    ${!ev ? '<option value="work">Работа</option>' : ''}
                    <option value="personal" selected>Личное</option>
                    <option value="interests">Интересы</option>
                  </select>
                  <input type="time" name="time" class="input" style="width:128px;" />
                </div>
                <button type="submit" class="btn btn-primary btn-sm" style="width:100%;">Добавить на эту дату</button>
              </form>
            </div>
          </div>
        </div>
      `;
    }

    function shiftCalMonth(d) { const dt = new Date(ui.calYear, ui.calMonth + d, 1); ui.calYear = dt.getFullYear(); ui.calMonth = dt.getMonth(); renderView(); }
    function jumpCalToday() { const now = new Date(); ui.calYear = now.getFullYear(); ui.calMonth = now.getMonth(); ui.calSelectedDate = toDateStr(now); renderView(); }
    function toggleCycleOnCalendar() { state.settings.showCycleOnCalendar = !state.settings.showCycleOnCalendar; saveState(); renderView(); }
    function handleCalAddTask(e, dateStr) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const title = fd.get('title').trim();
      if (!title) return;
      const domain = fd.get('domain');
      state.tasks.unshift({ id: uid('t'), title, domain, subcategory: DOMAINS[domain].subcategories[0], date: dateStr, time: fd.get('time') || '', priority: 'normal', note: '', completed: false });
      saveState(); renderView(); showToast(`Задача добавлена на ${formatHumanDate(dateStr)}`);
    }

    /* ==========================================================================
       10. РАЗДЕЛ 4: ТРЕКЕРЫ ПРИВЫЧЕК (GOSSAMER GREEN)
       ========================================================================== */
    function renderHabitsView() {
      const today = toDateStr();
      const ws = ui.habitWeekStart;
      const days = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
      const totalPos = state.habits.length * 7;
      let totalDone = 0;
      state.habits.forEach(h => days.forEach(d => { if (h.logs?.[d]) totalDone++; }));
      const weekPct = totalPos ? Math.round((totalDone / totalPos) * 100) : 0;

      return `
        <div class="view-enter stack">
          <div class="page-header">
            <div>
              <div class="eyebrow">Ежедневная забота</div>
              <h1 class="page-title">Трекеры</h1>
            </div>
            <div class="row" style="flex-wrap:wrap;">
              <div class="card row" style="padding: 6px; border-radius: 14px; gap: 4px;">
                <button onclick="ui.habitWeekStart=addDays(ui.habitWeekStart,-7); renderView();" class="icon-btn sm ghost">${iconSvg('<polyline points="15 18 9 12 15 6"/>', 17)}</button>
                <button onclick="ui.habitWeekStart=getMondayOfWeek(toDateStr()); renderView();" class="btn btn-secondary btn-sm" style="border:none;">${formatHumanDate(days[0])} — ${formatHumanDate(days[6])}</button>
                <button onclick="ui.habitWeekStart=addDays(ui.habitWeekStart,7); renderView();" class="icon-btn sm ghost">${iconSvg('<polyline points="9 18 15 12 9 6"/>', 17)}</button>
              </div>
              <button onclick="openHabitModal()" class="btn btn-primary btn-sm">
                ${iconSvg('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', 16)}
                <span>Новая привычка</span>
              </button>
            </div>
          </div>

          <div class="card row-between" style="background: linear-gradient(135deg, #FFFFFF, rgba(181,211,190,0.34));">
            <div>
              <div class="text-sm muted">Выполнение за неделю</div>
              <div style="font-size:32px; font-weight:700;">${weekPct}% <span class="muted" style="font-size:18px; font-weight:500;">(${totalDone} из ${totalPos})</span></div>
            </div>
            <div class="progress-track" style="max-width: 280px; height: 9px;">
              <div class="progress-fill" style="width:${weekPct}%; background: var(--p-gossamer-green);"></div>
            </div>
          </div>

          ${state.habits.length ? `
            <div class="card" style="padding: 8px 14px;">
              <div class="table-wrap">
                <table class="habits-table">
                  <thead>
                    <tr>
                      <th style="text-align:left; font-size:16px;" class="muted">Привычка</th>
                      ${days.map((d, i) => `
                        <th style="text-align:center;">
                          <div class="text-xs muted">${WEEKDAYS_SHORT_MON[i]}</div>
                          <div class="cal-day-num ${d === today ? 'today' : ''}" style="margin-top:4px;">${parseDateStr(d).getDate()}</div>
                        </th>
                      `).join('')}
                      <th style="text-align:right; font-size:16px;" class="muted">Серия / %</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${state.habits.map(h => {
                      const streak = getHabitStreak(h);
                      const pct = getHabitWeekPct(h, ws);
                      return `
                        <tr>
                          <td>
                            <div style="font-size:19px; font-weight:600;">${esc(h.name)}</div>
                            <div class="text-xs muted">${DOMAINS[h.domain]?.label || 'Личное'}</div>
                          </td>
                          ${days.map(d => {
                            const done = Boolean(h.logs?.[d]);
                            return `
                              <td style="text-align:center;">
                                <button onclick="toggleHabitDay('${h.id}', '${d}')" class="habit-check-btn ${done ? 'done' : ''}" aria-label="Отметить ${d}">
                                  ${done ? iconSvg('<polyline points="20 6 9 17 4 12"/>', 16) : ''}
                                </button>
                              </td>
                            `;
                          }).join('')}
                          <td style="text-align:right; white-space:nowrap;">
                            <div class="row" style="justify-content:flex-end; gap:10px;">
                              <div>
                                <div style="font-size:17px; font-weight:700;">${pct}%</div>
                                <div class="text-xs muted">${streak > 0 ? `Серия ${pluralDays(streak)}` : '0 дней'}</div>
                              </div>
                              <button onclick="deleteHabit('${h.id}')" class="icon-btn sm ghost danger" title="Удалить">${iconSvg('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>', 16)}</button>
                            </div>
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          ` : `
            <div class="empty-box">
              <h3 style="font-size:24px;">Привычек пока нет</h3>
              <p class="muted" style="margin:6px 0 14px;">Добавьте первую маленькую рутину, которую хочется бережно повторять.</p>
              <button onclick="openHabitModal()" class="btn btn-primary btn-sm">Создать привычку</button>
            </div>
          `}
        </div>
      `;
    }

    function toggleHabitDay(id, dateStr) {
      const h = state.habits.find(x => x.id === id);
      if (!h) return;
      h.logs = h.logs || {};
      if (h.logs[dateStr]) delete h.logs[dateStr];
      else h.logs[dateStr] = true;
      saveState();
      renderView();
    }

    async function deleteHabit(id) {
      if (!(await askConfirm('Удалить привычку?', 'История отметок по этой привычке будет удалена.'))) return;
      state.habits = state.habits.filter(h => h.id !== id);
      saveState(); renderView(); showToast('Привычка удалена');
    }

    function openHabitModal() {
      openModal(`
        <div class="row-between" style="margin-bottom:18px;">
          <h3 style="font-size:28px;">Новая привычка</h3>
          <button onclick="closeModal()" class="icon-btn sm ghost">${iconSvg('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>', 19)}</button>
        </div>
        <form onsubmit="saveHabitForm(event)" class="stack-sm">
          <div>
            <label class="field-label">Название</label>
            <input type="text" name="name" class="input" required placeholder="Например: 15 минут растяжки утром" autofocus />
          </div>
          <div>
            <label class="field-label">Сфера</label>
            <select name="domain" class="input">
              <option value="personal">Личное</option>
              <option value="interests">Интересы</option>
              <option value="work">Работа</option>
            </select>
          </div>
          <div class="row" style="justify-content:flex-end; margin-top:8px;">
            <button type="button" onclick="closeModal()" class="btn btn-secondary btn-sm">Отмена</button>
            <button type="submit" class="btn btn-primary btn-sm">Добавить</button>
          </div>
        </form>
      `);
    }

    function saveHabitForm(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const name = fd.get('name').trim();
      if (!name) return;
      state.habits.push({ id: uid('h'), name, domain: fd.get('domain'), logs: {} });
      saveState(); closeModal(); renderView(); showToast('Привычка добавлена', 'var(--p-gossamer-green)');
    }

    /* ==========================================================================
       11. РАЗДЕЛ 5: КИНО
       ========================================================================== */
    function renderStarRatingHTML(score, onClickExprBuilder) {
      const n = Number(score) || 0;
      const starPath = '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>';
      return `
        <div class="star-bar">
          ${Array.from({ length: 10 }, (_, idx) => {
            const val = idx + 1;
            const filled = val <= n;
            return `<button type="button" onclick="${onClickExprBuilder(val)}" class="star-btn ${filled ? 'filled' : ''}" title="${val} из 10">${iconSvg(starPath, 19)}</button>`;
          }).join('')}
        </div>
      `;
    }

    function renderMoviesView() {
      const all = state.movies;
      const watched = all.filter(m => m.status === 'watched');
      const planned = all.filter(m => m.status === 'planned');
      const rated = watched.filter(m => Number(m.rating) > 0);
      const avg = rated.length ? (rated.reduce((s, x) => s + Number(x.rating), 0) / rated.length).toFixed(1) : '—';

      const list = getFilteredMovies();

      return `
        <div class="view-enter stack">
          <div class="page-header">
            <div>
              <div class="eyebrow">Кинодневник и оценки</div>
              <h1 class="page-title">Кино</h1>
            </div>
            <button onclick="openMovieModal()" class="btn btn-primary btn-sm">
              ${iconSvg('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', 16)}
              <span>Добавить фильм</span>
            </button>
          </div>

          <div class="grid-3">
            <div class="card" style="background: linear-gradient(145deg, #FFFFFF, rgba(210,193,200,0.34));">
              <div class="text-sm muted">Просмотрено</div>
              <div style="font-size:32px; font-weight:700;">${watched.length}</div>
            </div>
            <div class="card" style="background: linear-gradient(145deg, #FFFFFF, rgba(198,216,240,0.38));">
              <div class="text-sm muted">В планах</div>
              <div style="font-size:32px; font-weight:700;">${planned.length}</div>
            </div>
            <div class="card" style="background: linear-gradient(145deg, #FFFFFF, rgba(242,233,177,0.45));">
              <div class="text-sm muted">Средняя оценка</div>
